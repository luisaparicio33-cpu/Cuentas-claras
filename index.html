<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a3fbf">
<meta name="description" content="Finanzas personales y familiares: gastos, cuotas, tarjetas, conciliación de resúmenes y efectivo.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cuentas Claras</title>
<style>
:root{
  --bg:#f4f5f9;--card:#ffffff;--ink:#111318;--ink2:#52545e;--muted:#8a8d99;--line:#e6e7ee;
  --pri:#2a3fbf;--pri2:#4f63e6;--priSoft:#e8ebff;
  --good:#0f8a4b;--goodSoft:#e3f6ec;--warn:#b86e00;--warnSoft:#fff3dd;--bad:#c62f2f;--badSoft:#fde8e8;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#9a9ca6;
  --r:18px;--shadow:0 2px 10px rgba(20,24,60,.07);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#111216;--card:#1b1c22;--ink:#f0efec;--ink2:#c3c2b7;--muted:#8f909a;--line:#2c2d35;
  --pri:#6f7ff0;--pri2:#8b98f5;--priSoft:#262a4a;
  --good:#3fc181;--goodSoft:#173326;--warn:#f0ad3c;--warnSoft:#3a2d15;--bad:#ef6b6b;--badSoft:#3d1c1c;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#2a9a2a;--s7:#9085e9;--s8:#6f717c;
  --shadow:none;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#2a3fbf,#5b3fd1);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 12px 14px;display:flex;align-items:center;gap:7px}
header.top h1{font-size:17px;margin:0;flex:1;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mes{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.16);border-radius:999px;padding:2px}
.mes button{background:none;border:0;color:#fff;width:30px;height:32px;border-radius:50%;font-size:18px;cursor:pointer}
.mes span{min-width:62px;text-align:center;font-weight:600;font-size:14px}
main{padding:14px;max-width:760px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--ink2);display:flex;gap:6px;align-items:center}
.kpi .v{font-size:20px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.pos{color:var(--good)}.neg{color:var(--bad)}
nav.bot{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.bot button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:4px 2px;min-width:50px;flex:1;cursor:pointer}
nav.bot button .i{font-size:21px;line-height:1}
nav.bot button.on{color:var(--pri);font-weight:600}
nav.bot .fab{flex:none!important;min-width:0!important;background:linear-gradient(135deg,#2a3fbf,#5b3fd1);color:#fff;width:58px;height:58px;border-radius:50%;margin-top:-26px;font-size:30px;box-shadow:0 6px 18px rgba(42,63,191,.4);justify-content:center}
.row{display:flex;align-items:center;gap:10px}
.list .it{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--priSoft)}
.it .tx{flex:1;min-width:0}
.it .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .t2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .am{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.it .am small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.day{font-size:12px;color:var(--muted);font-weight:600;margin:12px 4px 4px;text-transform:capitalize}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;background:var(--priSoft);color:var(--pri);font-weight:600}
.chip.g{background:var(--goodSoft);color:var(--good)}.chip.w{background:var(--warnSoft);color:var(--warn)}.chip.b{background:var(--badSoft);color:var(--bad)}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--pri);color:#fff}
.btn.sec{background:var(--priSoft);color:var(--pri)}
.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--line)}
.btn.danger{background:var(--badSoft);color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font-weight:600;color:var(--ink2);cursor:pointer;font-size:14px}
.seg button.on{background:var(--card);color:var(--pri);box-shadow:var(--shadow)}
.seg.gasto button.on{color:var(--bad)}.seg .ing.on{color:var(--good)!important}
label.f,div.f{display:block;margin:12px 0 0}
label.f>span,div.f>span{display:block;font-size:12px;color:var(--ink2);margin-bottom:5px;font-weight:600}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;outline:none}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--pri)}
.amount{font-size:34px;font-weight:800;text-align:center;border:0!important;background:transparent!important;padding:6px!important;font-variant-numeric:tabular-nums}
.grid-chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.gc{overflow-wrap:anywhere;hyphens:auto;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;cursor:pointer;text-align:center;line-height:1.15;min-height:64px;justify-content:center}
.gc .e{font-size:22px}
.gc.on{border-color:var(--pri);background:var(--priSoft);color:var(--pri);font-weight:600}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.pill{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 13px;cursor:pointer;font-size:13px;white-space:nowrap}
.pill.on{border-color:var(--pri);background:var(--pri);color:#fff;font-weight:600}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:20px;cursor:pointer}
.stepper b{min-width:30px;text-align:center;font-size:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,30,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:0 0 8px;font-size:18px;display:flex;align-items:center}
.sheet h3 .x{margin-left:auto;background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted)}
.actions{display:flex;gap:10px;margin-top:16px;position:sticky;bottom:0;background:var(--card);padding-top:10px}
.actions .btn{flex:1}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;z-index:90;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.empty .e{font-size:40px}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:9px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px}
.legend .lg{display:flex;align-items:center;gap:8px}
.legend .dot{width:10px;height:10px;border-radius:3px;flex:none}
.legend .lg .n{flex:1;color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .lg b{font-variant-numeric:tabular-nums}
.donutwrap{display:grid;grid-template-columns:130px minmax(0,1fr);gap:14px;align-items:center}
.sug{display:flex;gap:12px;padding:12px;border-radius:14px;margin-bottom:8px;background:var(--bg);border:1px solid var(--line)}
.sug .e{font-size:22px}
.sug>div>b{display:block;margin-bottom:2px}
.sug p{margin:0;font-size:13px;color:var(--ink2)}
.sug.w{background:var(--warnSoft);border-color:transparent}.sug.b{background:var(--badSoft);border-color:transparent}.sug.g{background:var(--goodSoft);border-color:transparent}
.cc{border-radius:16px;padding:14px;color:#fff;margin-bottom:10px;position:relative;overflow:hidden}
.cc .n{font-weight:700}.cc .s{font-size:12px;opacity:.85}
.cc .v{font-size:22px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.cc .bdg{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.22);padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t td,table.t th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.small{font-size:12px;color:var(--muted)}
.tip{position:fixed;z-index:95;background:#1d1e26;color:#fff;font-size:12px;padding:6px 9px;border-radius:8px;pointer-events:none;display:none;white-space:nowrap}
.tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
hr.s{border:0;border-top:1px solid var(--line);margin:12px 0}
svg text{font-family:inherit}
.mt{margin-top:10px}.mb{margin-bottom:10px}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.hbtn{background:rgba(255,255,255,.18);border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:17px;font-weight:800;cursor:pointer;flex:none}
.hi{border:0;background:var(--priSoft);color:var(--pri);width:22px;height:22px;border-radius:50%;font:700 13px/22px Georgia,serif;font-style:italic;cursor:pointer;padding:0;flex:none;vertical-align:middle;margin-left:2px}
.tour-ov{position:fixed;inset:0;z-index:120;display:none}
.tour-hole{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(10,12,30,.66);outline:3px solid #fff;transition:all .28s ease;pointer-events:none}
.tour-bub{position:fixed;background:var(--card);color:var(--ink);border-radius:18px;padding:14px 15px;box-shadow:0 12px 36px rgba(0,0,0,.35);transition:top .25s,left .25s}
.slide{text-align:center;padding:4px 4px 0}
.slide .big{font-size:58px;line-height:1.1;margin:6px 0}
.slide h4{font-size:20px;margin:6px 0 8px}
.slide p,.slide li{font-size:15px;line-height:1.5;color:var(--ink2);text-align:left}
.slide ol,.slide ul{padding-left:20px;margin:6px 0}
.slide .ej{background:var(--priSoft);border-radius:14px;padding:10px 12px;text-align:left;font-size:14px;margin-top:10px}
.dots{display:flex;justify-content:center;gap:6px;margin:14px 0 4px}
.dots i{width:7px;height:7px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--pri);width:20px}
.tl{display:flex;align-items:center;gap:4px;margin:10px 0;font-size:12px}
.tl div{flex:1;border-radius:10px;padding:7px 4px;text-align:center}
.gl dt{font-weight:700;margin-top:12px}.gl dd{margin:3px 0 0;color:var(--ink2);font-size:14px;line-height:1.45}
</style>
</head>
<body>
<header class="top">
  <h1 id="ttl">Cuentas Claras</h1>
  <button id="helpBtn" class="hbtn" onclick="openAyuda()" aria-label="Ayuda">?</button>
  <button class="hbtn" data-h="gear" onclick="go('ajustes')" aria-label="Ajustes" style="font-size:16px">⚙️</button>
  <div class="mes" id="mesSel"><button onclick="moveMes(-1)" aria-label="Mes anterior">‹</button><span id="mesLbl"></span><button onclick="moveMes(1)" aria-label="Mes siguiente">›</button></div>
</header>
<main id="view"></main>
<nav class="bot">
  <button data-v="inicio" onclick="go('inicio')"><span class="i">🏠</span>Inicio</button>
  <button data-v="movs" onclick="go('movs')"><span class="i">📋</span>Movim.</button>
  <button class="fab" data-h="fab" onclick="openMov()" aria-label="Cargar movimiento">+</button>
  <button data-v="agenda" onclick="go('agenda')"><span class="i">📌</span>Agenda</button>
  <button data-v="conc" onclick="go('conc')"><span class="i">🔗</span>Conciliar</button>
  <button data-v="anal" onclick="go('anal')"><span class="i">📊</span>Análisis</button>
</nav>
<div class="sheet-bg" id="sheetBg" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="tip" id="tip"></div>
<div class="sheet-bg" id="dlgBg" style="z-index:80;align-items:center;padding:20px"><div class="sheet" id="dlg" style="border-radius:20px;max-width:420px"></div></div>

<script src="config.js"></script>
<script>
'use strict';
/* ============ Datos y utilidades ============ */
const KEY='cc_data_v1';
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const daysIn=(y,m)=>new Date(y,m+1,0).getDate();
const mkDate=(y,m,d)=>new Date(y,m,Math.min(Math.max(1,d),daysIn(y,m)));
const addM=(y,m,k)=>{const t=y*12+m+k;return[Math.floor(t/12),t%12]};
const MES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,cur)=>new Intl.NumberFormat('es-AR',{style:'currency',currency:cur||'ARS',maximumFractionDigits:0}).format(Math.round(n||0));
const fmt2=(n,cur)=>new Intl.NumberFormat('es-AR',{style:'currency',currency:cur||'ARS',minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);
const fmtK=n=>{const a=Math.abs(n);return (n<0?'-':'')+(a>=1e6?(a/1e6).toFixed(1).replace('.',',')+'M':a>=1e3?Math.round(a/1e3)+'k':Math.round(a))};
const dayDiff=(a,b)=>Math.round((parseYmd(a)-parseYmd(b))/864e5);
const today=()=>ymd(new Date());
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const COLORS=['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)','var(--s7)','var(--s8)'];
const CARD_BG={visa:'linear-gradient(135deg,#1a2f8a,#3555d6)',master:'linear-gradient(135deg,#8a2a1a,#d6553a)',mp:'linear-gradient(135deg,#0a6fb5,#2db0e8)',icbc:'linear-gradient(135deg,#7a1020,#c4243c)',def:'linear-gradient(135deg,#3b3f52,#6b6f86)'};

const TIPOS_MET={credito:'Tarjeta de crédito',debito:'Tarjeta de débito',cuenta:'Cuenta bancaria',billetera:'Billetera virtual',efectivo:'Efectivo'};
const NEW_CATS=['familia','seguros','prest'];
function defaults(){
  return {v:2,cfg:{tc:1200,theme:'auto',hormiga:5000},
  metodos:[
    {id:'efe',nombre:'Efectivo',tipo:'efectivo',saldoInicial:0,moneda:'ARS'},
    {id:'cgal',nombre:'Cuenta Galicia',tipo:'cuenta',saldoInicial:0,moneda:'ARS'},
    {id:'cicbc',nombre:'Cuenta ICBC',tipo:'cuenta',saldoInicial:0,moneda:'ARS'},
    {id:'mp',nombre:'Mercado Pago',tipo:'billetera',saldoInicial:0,moneda:'ARS'},
    {id:'dgal',nombre:'Débito Galicia',tipo:'debito',cuenta:'cgal'},
    {id:'vgal',nombre:'Visa Galicia',tipo:'credito',cierre:24,venc:5,estilo:'visa',cuentaPago:'cgal',cierres:[],adicionales:[]},
    {id:'mgal',nombre:'Mastercard Galicia',tipo:'credito',cierre:24,venc:5,estilo:'master',cuentaPago:'cgal',cierres:[],adicionales:[]},
    {id:'vmp',nombre:'Visa Mercado Pago',tipo:'credito',cierre:20,venc:1,estilo:'mp',cuentaPago:'mp',cierres:[],adicionales:[]},
    {id:'vicbc',nombre:'Visa ICBC',tipo:'credito',cierre:26,venc:8,estilo:'icbc',cuentaPago:'cicbc',cierres:[],adicionales:[]}
  ],
  cats:[
    ['super','Supermercado','🛒'],['comida','Comida afuera','🍔'],['delivery','Delivery','🛵'],['comb','Combustible','⛽'],
    ['transp','Transporte','🚌'],['hogar','Hogar','🏠'],['serv','Servicios','💡'],['salud','Salud','💊'],
    ['educ','Educación','🎓'],['familia','Familia','👨‍👩‍👧'],['ropa','Ropa','👕'],['ocio','Ocio','🎬'],['subs','Suscripciones','📺'],
    ['auto','Auto','🚗'],['seguros','Seguros','🛡️'],['masc','Mascotas','🐾'],['imp','Impuestos','🧾'],['regalo','Regalos','🎁'],
    ['viaje','Viajes','✈️'],['deporte','Deporte','🏋️'],['prest','Préstamos','🏛️'],['banco','Comisiones/Intereses','🏦'],['otros','Otros','📦']
  ].map(([id,nombre,e])=>({id,nombre,e,tipo:'gasto'})).concat([
    ['sueldo','Sueldo','💼'],['honor','Honorarios','🧑‍💼'],['inv','Inversiones','📈'],['alq','Alquileres','🏘️'],['reint','Reintegros','↩️'],['oting','Otros ingresos','💰']
  ].map(([id,nombre,e])=>({id,nombre,e,tipo:'ingreso'}))),
  miembros:['Yo'],
  movs:[],resumenes:[],fijos:[],prestamos:[],ingProy:[],skip:{},miembrosBaja:[]};
}
function migrate(d){const def=defaults();for(const k in def)if(d[k]===undefined)d[k]=def[k];d.cfg=Object.assign({},def.cfg,d.cfg);
  def.cats.filter(c=>NEW_CATS.includes(c.id)).forEach(c=>{if(!d.cats.some(x=>x.id===c.id))d.cats.splice(d.cats.findIndex(x=>x.tipo==='ingreso'),0,c)});
  d.metodos.forEach(m=>{if(m.tipo==='credito'){if(!Array.isArray(m.adicionales))m.adicionales=[];if(!m.cierres)m.cierres=[]}else if(m.tipo!=='debito'&&!m.moneda)m.moneda='ARS'});
  d.v=2;return d}
function load(){try{const r=localStorage.getItem(KEY);if(r)return migrate(JSON.parse(r))}catch(e){}return defaults()}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));S._dirty=(S._dirty||0)+1}catch(e){toast('⚠️ No se pudo guardar en este dispositivo. Exportá un respaldo.')}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

const met=id=>S.metodos.find(m=>m.id===id);
const cat=id=>S.cats.find(c=>c.id===id)||{nombre:'Sin categoría',e:'❔'};

/* ============ Lógica de tarjetas ============ */
function cierreDe(m,y,mo){
  const key=y+'-'+pad(mo+1);
  const ov=(m.cierres||[]).find(o=>o.cierre&&o.cierre.slice(0,7)===key);
  const c=ov?parseYmd(ov.cierre):mkDate(y,mo,+m.cierre||25);
  let v;
  if(ov&&ov.venc)v=parseYmd(ov.venc);
  else{v=mkDate(c.getFullYear(),c.getMonth(),+m.venc||5);if(v<=c){const[a,b]=addM(c.getFullYear(),c.getMonth(),1);v=mkDate(a,b,+m.venc||5)}}
  return{cierre:ymd(c),venc:ymd(v)};
}
function ciclo(m,fecha,k){
  const d=parseYmd(fecha);let y=d.getFullYear(),mo=d.getMonth();
  const c=cierreDe(m,y,mo);if(fecha>c.cierre)[y,mo]=addM(y,mo,1);
  [y,mo]=addM(y,mo,k||0);return cierreDe(m,y,mo);
}
function cuotasDe(mv){
  const m=met(mv.metodo);const n=Math.max(1,+mv.cuotas||1);const mon=mv.moneda||'ARS';
  const impO=mv.impCuota?+mv.impCuota:(+mv.importe||0)/n;const cred=m&&m.tipo==='credito';const out=[];
  let desde=1,base=mv.fecha;
  if(mv.ancla&&cred){desde=Math.max(1,n-(+mv.pend||n)+1);base=mv.ancla}
  for(let i=desde;i<=n;i++){const c=cred?ciclo(m,base,i-desde):{cierre:mv.fecha,venc:mv.fecha};
    out.push({mov:mv,i,n,imp:impO,mon,importe:conv(impO,mon,'ARS'),cierre:c.cierre,venc:c.venc,key:mv.id+'#'+i,pl:mv.plastico||'',est:!!mv.est})}
  return out;
}
function cuotasTarjeta(mid){const r=[];S.movs.forEach(mv=>{if(mv.tipo==='gasto'&&mv.metodo===mid)r.push(...cuotasDe(mv))});return r}
function estimadosFijos(mid,meses){const m=met(mid);const out=[];const hoy=today();const ym0=hoy.slice(0,7);
  S.fijos.filter(f=>f.metodo===mid&&f.activo!==false).forEach(f=>{for(let k=0;k<meses;k++){const ym=ymAdd(ym0,k);const d=fijoVence(f,ym);if(!d||pagoFijo(f,ym)||S.skip[f.id+'|'+ym])continue;
    const c=ciclo(m,d,0);const fake={id:'est_'+f.id+ym,desc:f.nombre,cat:f.cat,fecha:d,est:true,plastico:f.plastico||'',moneda:f.moneda||'ARS',importe:+f.importe||0,fijo:f.id};
    out.push({mov:fake,i:1,n:1,imp:+f.importe||0,mon:f.moneda||'ARS',importe:conv(+f.importe||0,f.moneda,'ARS'),cierre:c.cierre,venc:c.venc,key:fake.id,pl:f.plastico||'',est:true,proy:true})}});
  return out}
function resumenesTarjeta(m,desde,cant,pl){
  const map={};const add=c=>{if(pl!==undefined&&pl!==null&&(c.pl||'')!==pl)return;const r=map[c.venc]=map[c.venc]||{venc:c.venc,cierre:c.cierre,ars:0,usd:0,total:0,items:[]};
    if(c.mon==='USD')r.usd+=c.imp;else r.ars+=c.imp;r.total+=c.importe;r.items.push(c)};
  cuotasTarjeta(m.id).forEach(add);estimadosFijos(m.id,12).forEach(add);
  return Object.values(map).filter(r=>r.venc>=(desde||today())).sort((a,b)=>a.venc<b.venc?-1:1).slice(0,cant||3);
}
function proximosResumenes(m,cant){return resumenesTarjeta(m,today(),cant)}
/* ============ Saldos ============ */
function saldos(){
  const b={},bu={};S.metodos.forEach(m=>{b[m.id]=+m.saldoInicial||0;bu[m.id]=m.tipo==='credito'?(+m.saldoInicialUSD||0):0});
  const cuentaDe=id=>{const m=met(id);return m&&m.tipo==='debito'&&m.cuenta?m.cuenta:id};
  const monDe=id=>met(id)?.moneda||'ARS';
  const cred=(id,v,mon,sg)=>{if((mon||'ARS')==='USD')bu[id]+=sg*v;else b[id]+=sg*v};
  const acc=(id,mv,sg)=>{if(b[id]===undefined)return;b[id]+=sg*conv(+mv.importe||0,mv.moneda,monDe(id))};
  S.movs.forEach(mv=>{
    if(mv.tipo==='gasto'){const m=met(mv.metodo);if(!m)return;
      if(m.tipo==='credito'){let v=+mv.importe||0;if(mv.ancla){const n=+mv.cuotas||1,p=+mv.pend||n;v=mv.impCuota?mv.impCuota*p:v*p/n}cred(m.id,v,mv.moneda,1)}
      else acc(cuentaDe(m.id),mv,-1)}
    else if(mv.tipo==='ingreso')acc(cuentaDe(mv.destino),mv,1);
    else if(mv.tipo==='transf'){const o=met(mv.origen),d=met(mv.destino);
      if(o){if(o.tipo==='credito')cred(o.id,+mv.importe,mv.moneda,1);else acc(cuentaDe(o.id),mv,-1)}
      if(d){if(d.tipo==='credito')cred(d.id,+mv.importe,mv.moneda,-1);else acc(cuentaDe(d.id),mv,1)}}
  });
  b._usd=bu;return b;
}
const movsMes=(ym)=>S.movs.filter(m=>!m.ancla&&m.fecha.slice(0,7)===ym);
function totales(ym){let g=0,i=0;movsMes(ym).forEach(m=>{if(m.tipo==='gasto')g+=ars(m);else if(m.tipo==='ingreso')i+=ars(m)});return{g,i}}
function efectivoMes(ym){
  const ef=S.metodos.filter(m=>m.tipo==='efectivo').map(m=>m.id);let ret=0,gas=0,ing=0,sal=0;
  movsMes(ym).forEach(m=>{const v=ars(m);
    if(m.tipo==='transf'&&ef.includes(m.destino))ret+=v;
    if(m.tipo==='transf'&&ef.includes(m.origen))sal+=v;
    if(m.tipo==='ingreso'&&ef.includes(m.destino))ing+=v;
    if(m.tipo==='gasto'&&ef.includes(m.metodo))gas+=v});
  return{ret,gas,ing,sal,dif:ret+ing-gas-sal};
}

/* ============ Gráficos SVG ============ */
function donut(data,size){
  size=size||130;const tot=data.reduce((a,d)=>a+d.v,0);if(!tot)return'';
  const r=size/2-10,cx=size/2,cy=size/2,w=22;let a0=-Math.PI/2;let p='';
  data.forEach(d=>{const a=d.v/tot*Math.PI*2;const gap=data.length>1?0.025:0;const s=a0+gap/2,e=a0+a-gap/2;
    if(data.length===1){p+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.c}" stroke-width="${w}" data-tip="${esc(d.l)}: ${fmt(d.v)} (100%)"/>`}
    else{const large=e-s>Math.PI?1:0;const x1=cx+r*Math.cos(s),y1=cy+r*Math.sin(s),x2=cx+r*Math.cos(e),y2=cy+r*Math.sin(e);
    p+=`<path d="M${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)}" fill="none" stroke="${d.c}" stroke-width="${w}" data-tip="${esc(d.l)}: ${fmt(d.v)} (${Math.round(d.v/tot*100)}%)"/>`}
    a0+=a});
  return`<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="Distribución">${p}<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="11" fill="var(--muted)">Total</text><text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">${fmtK(tot)}</text></svg>`;
}
function bars(labels,series,opt){
  opt=opt||{};const W=340,H=opt.h||170,pl=36,pb=22,pt=10;const n=labels.length;
  const max=Math.max(1,...series.flatMap(s=>s.vals));const step=niceMax(max);
  const gw=(W-pl-6)/n;const bw=Math.min(18,(gw-8)/series.length-2);
  let g='';for(let k=0;k<=4;k++){const v=step/4*k;const y=H-pb-(H-pb-pt)*v/step;g+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-5}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--muted)">${fmtK(v)}</text>`}
  labels.forEach((l,i)=>{const x0=pl+gw*i+gw/2-(bw+2)*series.length/2;
    series.forEach((s,j)=>{const v=s.vals[i]||0;const h=(H-pb-pt)*v/step;const x=x0+j*(bw+2),y=H-pb-h;
      if(h>0)g+=`<path d="M${x},${H-pb} V${y+Math.min(4,h)} Q${x},${y} ${x+Math.min(4,bw/2)},${y} H${x+bw-Math.min(4,bw/2)} Q${x+bw},${y} ${x+bw},${y+Math.min(4,h)} V${H-pb} Z" fill="${s.c}"/>`;
      g+=`<rect x="${x-1}" y="${pt}" width="${bw+2}" height="${H-pb-pt}" fill="transparent" data-tip="${esc(l)} · ${esc(s.n)}: ${fmt(v)}"/>`});
    g+=`<text x="${pl+gw*i+gw/2}" y="${H-6}" text-anchor="middle" font-size="10.5" fill="var(--ink2)">${esc(l)}</text>`});
  const lg=series.length>1?`<div class="row" style="gap:14px;font-size:12px;color:var(--ink2);margin-bottom:6px">${series.map(s=>`<span class="row" style="gap:5px"><i class="dot" style="width:10px;height:10px;border-radius:3px;background:${s.c};display:inline-block"></i>${esc(s.n)}</span>`).join('')}</div>`:'';
  return lg+`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opt.label||'Gráfico de barras')}">${g}</svg>`;
}
function stackBars(labels,series,opt){
  opt=opt||{};const W=340,H=opt.h||180,pl=36,pb=22,pt=10;const n=labels.length;
  const tots=labels.map((_,i)=>series.reduce((a,s)=>a+(s.vals[i]||0),0));const step=niceMax(Math.max(1,...tots));
  const gw=(W-pl-6)/n,bw=Math.min(30,gw-12);let g='';
  for(let k=0;k<=4;k++){const v=step/4*k;const y=H-pb-(H-pb-pt)*v/step;g+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-5}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--muted)">${fmtK(v)}</text>`}
  labels.forEach((l,i)=>{const x=pl+gw*i+(gw-bw)/2;let y0=H-pb;const segs=series.filter(s=>s.vals[i]>0);
    segs.forEach((s,j)=>{const h=(H-pb-pt)*s.vals[i]/step;const top=j===segs.length-1;const y=y0-h;const hh=Math.max(0,h-(j?2:0));
      g+=top&&hh>4?`<path d="M${x},${y0-(j?2:0)} V${y+4} Q${x},${y} ${x+4},${y} H${x+bw-4} Q${x+bw},${y} ${x+bw},${y+4} V${y0-(j?2:0)} Z" fill="${s.c}" data-tip="${esc(l)} · ${esc(s.n)}: ${fmt(s.vals[i])}"/>`:`<rect x="${x}" y="${y}" width="${bw}" height="${hh}" fill="${s.c}" data-tip="${esc(l)} · ${esc(s.n)}: ${fmt(s.vals[i])}"/>`;y0=y});
    if(tots[i])g+=`<text x="${x+bw/2}" y="${y0-4}" text-anchor="middle" font-size="9.5" fill="var(--ink2)">${fmtK(tots[i])}</text>`;
    g+=`<text x="${pl+gw*i+gw/2}" y="${H-6}" text-anchor="middle" font-size="10.5" fill="var(--ink2)">${esc(l)}</text>`});
  const lg=`<div class="row" style="gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-bottom:6px">${series.map(s=>`<span class="row" style="gap:5px"><i style="width:10px;height:10px;border-radius:3px;background:${s.c};display:inline-block"></i>${esc(s.n)}</span>`).join('')}</div>`;
  return lg+`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opt.label||'Gráfico apilado')}">${g}</svg>`}
function compromisos(fut){const ser=[];
  S.metodos.filter(x=>x.tipo==='credito'&&!esAdic(x)).forEach(t=>{const rs=resumenesTarjeta(t,fut[0]+'-01',24);ser.push({n:t.nombre,vals:fut.map(f=>rs.filter(r=>r.venc.slice(0,7)===f).reduce((a,r)=>a+r.total,0))})});
  ser.push({n:'Préstamos',vals:fut.map(f=>S.prestamos.reduce((a,p)=>{const c=cuotaPrestamo(p,f);return a+(c?conv(+p.cuota,p.moneda,'ARS'):0)},0))});
  ser.push({n:'Fijos (sin tarjeta)',vals:fut.map(f=>S.fijos.reduce((a,x)=>{const m=met(x.metodo);if(m&&m.tipo==='credito')return a;return a+(fijoVence(x,f)?conv(+x.importe||0,x.moneda,'ARS'):0)},0))});
  return ser.filter(s=>s.vals.some(v=>v)).slice(0,8).map((s,i)=>Object.assign(s,{c:COLORS[i]}))}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of[1,1.5,2,2.5,3,4,5,6,8,10])if(m*p>=v)return m*p;return v}
function bindTips(){const tip=$('#tip');document.querySelectorAll('[data-tip]').forEach(el=>{
  const show=e=>{tip.textContent=el.dataset.tip;tip.style.display='block';const t=e.touches?e.touches[0]:e;tip.style.left=Math.min(innerWidth-tip.offsetWidth-8,t.clientX+10)+'px';tip.style.top=(t.clientY-36)+'px'};
  el.addEventListener('mousemove',show);el.addEventListener('touchstart',show,{passive:true});el.addEventListener('mouseleave',()=>tip.style.display='none');el.addEventListener('touchend',()=>setTimeout(()=>tip.style.display='none',1400))})}
function catBreak(ym){const m={};movsMes(ym).filter(x=>x.tipo==='gasto').forEach(x=>m[x.cat]=(m[x.cat]||0)+ars(x));
  const arr=Object.entries(m).sort((a,b)=>b[1]-a[1]);const top=arr.slice(0,7).map(([k,v])=>({l:cat(k).e+' '+cat(k).nombre,v,id:k}));

function legend(data){const tot=data.reduce((a,d)=>a+d.v,0);return`<div class="legend">${data.map(d=>`<div class="lg"><i class="dot" style="background:${d.c}"></i><span class="n">${esc(d.l)}</span><b>${fmt(d.v)}</b><span class="small" style="width:30px;text-align:right;flex:none">${Math.round(d.v/tot*100)}%</span></div>`).join('')}</div>`}

const FREQ={1:'Mensual',2:'Bimestral',3:'Trimestral',6:'Semestral',12:'Anual',0:'Una sola vez'};

function fijoVence(f,ym){if(f.activo===false||!f.desde)return null;const d=ymDiff(ym,f.desde);const q=fq(f);if(d<0||(q===0?d!==0:d%q))return null;if(f.hasta&&ym>f.hasta)return null;const[y,m]=ym.split('-').map(Number);return ymd(mkDate(y,m-1,+f.dia||1))}
const pagoFijo=(f,ym)=>S.movs.find(x=>x.fijo===f.id&&x.fijoMes===ym);
function cuotaPrestamo(p,ym){if(!p.proxima)return null;const d=ymDiff(ym,p.proxima.slice(0,7));const k=(+p.pagadas||0)+1+d;if(d<0||k>+p.n)return null;const[y,m]=ym.split('-').map(Number);return{k,fecha:ymd(mkDate(y,m-1,+p.dia||+p.proxima.slice(8)))}}

function estadoPrestamo(p){const pag=(+p.pagadas||0)+S.movs.filter(x=>x.prest===p.id).length;const rest=Math.max(0,(+p.n||0)-pag);

  const fin=p.proxima?ymAdd(p.proxima.slice(0,7),S.movs.filter(x=>x.prest===p.id).length+rest-1):'';

    for(let g=0;ym<=ymH&&g<60;g++,ym=ymAdd(ym,1)){const d=fijoVence(f,ym);if(!d||d>hoy||d<c0||pagoFijo(f,ym)||S.skip[f.id+'|'+ym])continue;
      const mv={id:uid(),tipo:'gasto',fecha:d,hora:'',importe:+f.importe||0,moneda:f.moneda||'ARS',cat:f.cat||'otros',metodo:f.metodo,desc:f.nombre,cuotas:1,quien:f.quien||S.miembros[0],fijo:f.id,fijoMes:ym,auto:1};

  S.prestamos.forEach(p=>{if(!p.auto||!p.proxima)return;const c0=p.creadoF||hoy;let ym=p.proxima.slice(0,7);
    for(let g=0;ym<=ymH&&g<240;g++,ym=ymAdd(ym,1)){const c=cuotaPrestamo(p,ym);if(!c||c.fecha>hoy||c.fecha<c0||pagoPrest(p,c.k)||S.skip['p'+p.id+'|'+c.k])continue;
      S.movs.push({id:uid(),tipo:'gasto',fecha:c.fecha,hora:'',importe:+p.cuota,moneda:p.moneda||'ARS',cat:'prest',metodo:p.cuenta,desc:p.nombre+' cuota '+c.k+'/'+p.n,cuotas:1,quien:S.miembros[0],prest:p.id,prestCuota:c.k,auto:1});n++}});
  S.ingProy.forEach(f=>{if(!f.auto||f.activo===false||!f.desde)return;const c0=f.creadoF||hoy;let ym=f.desde>c0.slice(0,7)?f.desde:c0.slice(0,7);
    for(let g=0;ym<=ymH&&g<60;g++,ym=ymAdd(ym,1)){const d=fijoVence(f,ym);if(!d||d>hoy||d<c0||cobroIng(f,ym)||S.skip['i'+f.id+'|'+ym])continue;
      const mv={id:uid(),tipo:'ingreso',fecha:d,hora:'',importe:+f.importe||0,moneda:f.moneda||'ARS',cat:f.cat||'oting',destino:f.destino,desc:f.nombre,quien:S.miembros[0],ingP:f.id,ingMes:ym,auto:1};if(f.variable)mv.est=true;S.movs.push(mv);n++}});

const LIQ=m=>m.tipo==='cuenta'||m.tipo==='billetera'||m.tipo==='efectivo';
function liquidezHoy(){const s=saldos();return S.metodos.filter(LIQ).reduce((a,m)=>a+conv(s[m.id]||0,m.moneda||'ARS','ARS'),0)}
const esCorriente=x=>x.tipo==='gasto'&&!x.ancla&&!x.fijo&&!x.prest&&x.cat!=='prest'&&!((+x.cuotas||1)>1);
function corrienteAuto(){const ym0=today().slice(0,7);let t=0,k=0;for(let i=1;i<=3;i++){const ym=ymAdd(ym0,-i);const g=S.movs.filter(x=>esCorriente(x)&&x.fecha.slice(0,7)===ym).reduce((a,x)=>a+ars(x),0);if(g>0){t+=g;k++}}return k?t/k:0}
function corrienteMes(){return S.cfg.corriente!==undefined&&S.cfg.corriente!==null&&S.cfg.corriente!==''?+S.cfg.corriente:corrienteAuto()}
function cashflow(n){const hoy=today(),ym0=hoy.slice(0,7);const C=corrienteMes();const inf=(+S.cfg.infl||0)/100;const out=[];let saldo=liquidezHoy();
  for(let k=0;k<n;k++){const ym=ymAdd(ym0,k);const fx=Math.pow(1+inf,k);const r={ym,ing:0,tarj:0,prest:0,fijos:0,corr:0,det:{ing:[],tarj:[],prest:[],fijos:[]}};
    cobrosMes(ym).forEach(c=>{if(c.estado==='cobrado')return;r.ing+=c.monto;r.det.ing.push([c.f.nombre,c.monto,c.fecha])});
    S.metodos.filter(m=>m.tipo==='credito'&&!esAdic(m)).forEach(m=>{resumenesTarjeta(m,ym+'-01',40).filter(x=>x.venc.slice(0,7)===ym).forEach(x=>{let v=x.total;
      if(k===0){const lim=ymd(new Date(parseYmd(x.venc).getTime()+12*864e5));v=Math.max(0,v-S.movs.filter(t=>t.tipo==='transf'&&t.destino===m.id&&t.fecha>x.cierre&&t.fecha<=lim).reduce((a,t)=>a+ars(t),0))}
      if(v>0){r.tarj+=v;r.det.tarj.push([m.nombre,v,x.venc])}})});
    S.prestamos.forEach(p=>{const c=cuotaPrestamo(p,ym);if(!c||pagoPrest(p,c.k))return;const v=conv(+p.cuota,p.moneda,'ARS');r.prest+=v;r.det.prest.push([p.nombre+' '+c.k+'/'+p.n,v,c.fecha])});
    S.fijos.forEach(f=>{const m=met(f.metodo);if(m&&m.tipo==='credito')return;const d=fijoVence(f,ym);if(!d||pagoFijo(f,ym)||S.skip[f.id+'|'+ym])return;const v=conv(+f.importe||0,f.moneda,'ARS')*fx;r.fijos+=v;r.det.fijos.push([f.nombre,v,d])});
    if(k===0){const g=S.movs.filter(x=>esCorriente(x)&&x.fecha.slice(0,7)===ym).reduce((a,x)=>a+ars(x),0);r.corr=Math.max(0,C-g);r.gastado=g}else r.corr=C*fx;
    if(k===0){const da=deudaAcum(ym);r.atras=da.atras;r.det.atras=da.venc.map(i=>[i.nombre+' ('+lblMes(i.mes)+')',i.resta,i.fecha])}else r.atras=0;
    r.egr=r.tarj+r.prest+r.fijos+r.corr+r.atras;r.neto=r.ing-r.egr;r.ini=saldo;saldo+=r.neto;r.fin=saldo;out.push(r)}
  return out}
function lineChart(labels,vals,opt){opt=opt||{};const W=340,H=opt.h||170,pl=42,pb=22,pt=14;const mn=Math.min(0,...vals),mx=Math.max(0,...vals);

function saveFijo(){const f=FF;if(!f.nombre.trim())return toast('Poné un nombre');if(!(+f.importe>0))return toast('Ingresá el importe'+(f.variable?' estimado':''));if(!f.desde)return toast('Indicá el mes del primer vencimiento');

  <details class="mt"><summary>Opcional: capital y tasa (para ver capital pendiente e intereses)</summary>
   <div class="two"><label class="f"><span>Capital original</span><input class="in" inputmode="decimal" value="${p.capital===''?'':String(p.capital).replace('.',',')}" oninput="PF.capital=numIn(this.value)"></label><label class="f"><span>TNA %</span><input class="in" inputmode="decimal" value="${p.tna===''?'':String(p.tna).replace('.',',')}" oninput="PF.tna=numIn(this.value)"></label></div>
   <button class="btn sm sec mt" onclick="calcCuota()">Calcular cuota (sistema francés)</button><div class="small mt">La cuota real puede ser mayor por IVA sobre intereses y seguros: usá la del cronograma del banco.</div></details>

function calcCuota(){const i=(+PF.tna||0)/1200,P=+PF.capital,n=+PF.n;if(!P||!n)return toast('Completá capital y cantidad de cuotas');PF.cuota=Math.round((i?P*i/(1-Math.pow(1+i,-n)):P/n)*100)/100;drawPrest();toast('Cuota estimada: '+fmt2(PF.cuota,PF.moneda))}
function savePrest(){const p=PF;if(!p.nombre.trim())return toast('Poné un nombre');if(!(+p.cuota>0))return toast('Ingresá la cuota');if(!(+p.n>0))return toast('Cantidad de cuotas');if(!p.proxima)return toast('Fecha de la próxima cuota');if(+p.pagadas>=+p.n)return toast('Ya está todo pagado');
  p.nombre=p.nombre.trim();p.dia=+p.proxima.slice(8);if(!p.id){p.id=uid();p.creadoF=today();S.prestamos.push(p)}else S.prestamos[S.prestamos.findIndex(x=>x.id===p.id)]=p;generarAuto();save();closeSheet();render();toast('Guardado ✔')}
async function delPrest(){if(!await ask('¿Eliminar el préstamo? Las cuotas pagadas registradas se conservan.','Eliminar',1))return;S.prestamos=S.prestamos.filter(x=>x.id!==PF.id);save();closeSheet();render()}

/* ============ Vista: Movimientos ============ */
let FIL={tipo:'',met:'',q:''};
function vMovs(){
  let ms=movsMes(MES_ACT).filter(m=>(!FIL.tipo||m.tipo===FIL.tipo)&&(!FIL.met||[m.metodo,m.origen,m.destino].includes(FIL.met)));
  if(FIL.q){const q=FIL.q.toLowerCase();ms=ms.filter(m=>(m.desc||'').toLowerCase().includes(q)||cat(m.cat).nombre.toLowerCase().includes(q))}
  ms.sort(ordMov);
  let h=`<input class="in mb" data-h="buscar" placeholder="🔎 Buscar…" value="${esc(FIL.q)}" oninput="FIL.q=this.value;clearTimeout(window._q);window._q=setTimeout(()=>{render();const i=document.querySelector('main input');i.focus();i.setSelectionRange(i.value.length,i.value.length)},350)">
  <div class="hscroll mb" data-h="filtros">${[['','Todos'],['gasto','Gastos'],['ingreso','Ingresos'],['transf','Transferencias']].map(([k,l])=>`<button class="pill ${FIL.tipo===k?'on':''}" onclick="FIL.tipo='${k}';render()">${l}</button>`).join('')}</div>
  <div class="hscroll mb"><button class="pill ${!FIL.met?'on':''}" onclick="FIL.met='';render()">Todas las vías</button>${S.metodos.map(m=>`<button class="pill ${FIL.met===m.id?'on':''}" onclick="FIL.met='${m.id}';render()">${icoMet(m)} ${esc(m.nombre)}</button>`).join('')}</div>`;
  if(!ms.length)return h+`<div class="card empty"><div class="e">📭</div>No hay movimientos con ese filtro en ${MESL[+MES_ACT.slice(5)-1]}.</div>`;
  const tot=ms.reduce((a,m)=>a+(m.tipo==='gasto'?-ars(m):m.tipo==='ingreso'?ars(m):0),0);
  h+=`<div class="small mb">${ms.length} movimientos · neto ${fmt(tot)}</div><div class="card list" style="padding-top:2px">`;
  let last='';ms.forEach(m=>{if(m.fecha!==last){last=m.fecha;const d=parseYmd(m.fecha);h+=`<div class="day">${d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}</div>`}h+=itemMov(m)});
  return h+`</div><div class="row mb"><button class="btn sec sm" onclick="exportCSV()">⬇️ Exportar CSV</button></div>`;
}

/* ============ Formulario de movimiento ============ */
let F=null;
function openMov(id,pre){
  const ex=id?S.movs.find(m=>m.id===id):null;if(ex&&ex.compartido)return verCompartido(ex);
  F=ex?JSON.parse(JSON.stringify(ex)):Object.assign({id:null,tipo:'gasto',fecha:today(),hora:nowHM(),importe:'',moneda:'ARS',cuotas:1,cat:'',metodo:S.cfg.ultMet||'efe',destino:S.cfg.ultDest||'cgal',origen:'cgal',desc:'',quien:(S.cfg.ultQuien&&!esBaja(S.cfg.ultQuien)&&S.miembros.includes(S.cfg.ultQuien))?S.cfg.ultQuien:activos()[0]},pre||{});
  if(!F.metodo||!met(F.metodo))F.metodo=S.metodos[0]?.id;
  drawMov();openSheet();
}
function drawMov(){
  const g=F.tipo==='gasto',i=F.tipo==='ingreso',t=F.tipo==='transf';
  const uso={};S.movs.forEach(x=>{if(x.cat)uso[x.cat]=(uso[x.cat]||0)+1});const cats=S.cats.filter(c=>c.tipo===(i?'ingreso':'gasto')).sort((a,b)=>(uso[b.id]||0)-(uso[a.id]||0));
  const m=met(F.metodo);
  let h=`<div class="grab"></div><h3>${F.id?'Editar':'Nuevo'} movimiento<button class="x" onclick="closeSheet()">✕</button></h3>
  <div class="seg" data-h="fTipo"><button class="${g?'on':''}" style="${g?'color:var(--bad)':''}" onclick="F.tipo='gasto';F.cat='';drawMov()">Gasto</button><button class="${i?'on':''}" style="${i?'color:var(--good)':''}" onclick="F.tipo='ingreso';F.cat='';drawMov()">Ingreso</button><button class="${t?'on':''}" onclick="F.tipo='transf';drawMov()">Extracción / Transf.</button></div>
  <div class="row" style="margin-top:12px;justify-content:center"><select class="in" style="width:auto;padding:6px 8px" onchange="F.moneda=this.value;drawMov()"><option ${F.moneda==='ARS'?'selected':''}>ARS</option><option ${F.moneda==='USD'?'selected':''}>USD</option></select></div>
  <input class="in amount" id="fImp" inputmode="decimal" placeholder="$ 0" value="${F.importe===''?'':String(F.importe).replace('.',',')}" oninput="F.importe=numIn(this.value);updCuota()">`;
  if(g)h+=`<div class="f" data-h="fVia"><span>Vía de pago ${hi('via')}</span><div class="hscroll">${S.metodos.map(x=>`<button class="pill ${F.metodo===x.id?'on':''}" onclick="F.metodo='${x.id}';drawMov()">${icoMet(x)} ${esc(x.nombre)}</button>`).join('')}</div></div>`;
  if(!t){h+=`<div class="f" data-h="fCat"><span>Concepto ${hi('concepto')}</span><div class="grid-chips">${cats.map(c=>`<div class="gc ${F.cat===c.id?'on':''}" onclick="F.cat='${c.id}';drawMov()"><span class="e">${c.e}</span>${esc(c.nombre)}</div>`).join('')}</div></div>`}
  h+=`<label class="f"><span>Descripción</span><input class="in" placeholder="${t?'Ej: Cajero Galicia':'Ej: Coto, nafta YPF, Netflix…'}" value="${esc(F.desc)}" oninput="F.desc=this.value" list="dl"></label><datalist id="dl">${[...new Set(S.movs.map(x=>x.desc).filter(Boolean))].slice(-60).map(d=>`<option value="${esc(d)}">`).join('')}</datalist>`;
  if(g){
    if(m&&m.tipo==='credito'){h+=`<div class="f" data-h="fCuotas"><span>Forma de pago ${hi('cuotas')}</span><div class="row" style="justify-content:space-between"><div class="seg" style="flex:1"><button class="${F.cuotas<=1?'on':''}" onclick="F.cuotas=1;drawMov()">Un pago</button><button class="${F.cuotas>1?'on':''}" onclick="F.cuotas=Math.max(2,F.cuotas);drawMov()">En cuotas</button></div></div></div>`;
      if(F.cuotas>1)h+=`<div class="row mt" style="justify-content:space-between"><div class="stepper"><button onclick="F.cuotas=Math.max(2,F.cuotas-1);drawMov()">−</button><b>${F.cuotas}</b><button onclick="F.cuotas=Math.min(48,F.cuotas+1);drawMov()">+</button></div><div class="hscroll">${[3,6,9,12,18].map(n=>`<button class="pill ${F.cuotas===n?'on':''}" onclick="F.cuotas=${n};drawMov()">${n}</button>`).join('')}</div></div><div class="small mt" id="cuotaInfo"></div>`;
      else h+=`<div class="small mt" id="cuotaInfo"></div>`;}
  }
  if(i)h+=`<label class="f"><span>¿Dónde se depositó?</span><div class="hscroll">${S.metodos.filter(x=>x.tipo!=='credito'&&x.tipo!=='debito').map(x=>`<button class="pill ${F.destino===x.id?'on':''}" onclick="F.destino='${x.id}';drawMov()">${icoMet(x)} ${esc(x.nombre)}</button>`).join('')}</div></label>`;
  if(t){h+=`<label class="f"><span>Desde</span><div class="hscroll">${S.metodos.filter(x=>x.tipo!=='credito'&&x.tipo!=='debito').map(x=>`<button class="pill ${F.origen===x.id?'on':''}" onclick="F.origen='${x.id}';drawMov()">${icoMet(x)} ${esc(x.nombre)}</button>`).join('')}</div></label>
    <label class="f"><span>Hacia</span><div class="hscroll">${S.metodos.filter(x=>x.tipo!=='debito').map(x=>`<button class="pill ${F.destino===x.id?'on':''}" onclick="F.destino='${x.id}';drawMov()">${icoMet(x)} ${esc(x.nombre)}</button>`).join('')}</div></label>

  h+=`<div class="two" data-h="fFecha"><label class="f"><span>Fecha</span><input class="in" type="date" value="${F.fecha}" onchange="F.fecha=this.value;updCuota()"></label><label class="f"><span>Hora</span><input class="in" type="time" value="${F.hora||''}" onchange="F.hora=this.value"></label></div>`;
  if(g&&m&&m.tipo==='credito'&&(m.adicionales||[]).length)h+=`<label class="f"><span>Plástico usado</span><div class="hscroll">${['',...m.adicionales.filter(a=>!esBaja(a)||a===F.plastico)].map(a=>`<button class="pill ${(F.plastico||'')===a?'on':''}" onclick="F.plastico='${esc(a)}';if(S.miembros.includes(F.plastico))F.quien=F.plastico;drawMov()">💳 ${esc(a||'Titular')}</button>`).join('')}</div></label>`;
  if(F.ancla)h+=`<div class="sug mt"><span class="e">📥</span><div><b>Cuotas importadas</b><p>Quedan <b>${F.pend}</b> de ${F.cuotas} cuotas; la primera pendiente entra en el resumen que cierra el ${fdia(F.ancla)}.</p><div class="stepper mt"><button onclick="F.pend=Math.max(1,F.pend-1);drawMov()">−</button><b>${F.pend}</b><button onclick="F.pend=Math.min(F.cuotas,F.pend+1);drawMov()">+</button></div></div></div>`;
  if(F.est)h+=`<div class="sug w mt"><span class="e">✏️</span><div><b>Importe estimado</b><p>Generado automáticamente desde un gasto fijo. Corregilo con el importe real y guardá.</p></div></div>`;
  const qs=activos().concat(F.quien&&esBaja(F.quien)?[F.quien]:[]);
  if(qs.length>1)h+=`<label class="f"><span>¿Quién?</span><div class="hscroll">${qs.map(q=>`<button class="pill ${F.quien===q?'on':''}" onclick="F.quien='${esc(q)}';drawMov()">${esc(q)}</button>`).join('')}</div></label>`;
  h+=`<div class="actions">${F.id?`<button class="btn danger" style="flex:0 0 auto" onclick="delMov()">🗑</button>`:''}<button class="btn" onclick="saveMov()">Guardar</button></div>`;
  $('#sheet').innerHTML=h;updCuota();if(!(S.cfg.vistos||{}).form&&S.cfg.ayudaAuto!==false&&!TOUR)setTimeout(()=>{if($('#sheetBg').classList.contains('on')&&!TOUR&&!(S.cfg.vistos||{}).form)startTour('form')},450);document.querySelectorAll('#sheet .hscroll').forEach(sc=>{const on=sc.querySelector('.pill.on');if(on)sc.scrollLeft=on.offsetLeft-sc.offsetLeft-20});
}
function updCuota(){const el=$('#cuotaInfo');if(!el)return;const m=met(F.metodo);if(!m||m.tipo!=='credito'||!F.fecha){el.textContent='';return}
  const c=ciclo(m,F.fecha,0);const n=F.cuotas||1;const imp=(+F.importe||0)/n;
  el.innerHTML=`Entra en el resumen que cierra el <b>${fdia(c.cierre)}</b> y vence el <b>${fdia(c.venc)}</b>.${n>1?` ${n} cuotas de <b>${fmt2(imp,F.moneda)}</b>; última vence ${fdia(ciclo(m,F.fecha,n-1).venc)}.`:''}`}
function numIn(s){s=String(s).replace(/[^\d.,-]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return s===''?'':+s}
function saveMov(){
  const imp=+F.importe;if(!imp||imp<=0)return toast('Ingresá un importe');
  if(F.tipo!=='transf'&&!F.cat)return toast('Elegí un concepto');
  if(F.tipo==='transf'&&F.origen===F.destino)return toast('Origen y destino iguales');
  const o={id:F.id||uid(),tipo:F.tipo,fecha:F.fecha,hora:F.hora,importe:imp,moneda:F.moneda,desc:(F.desc||'').trim(),quien:F.quien};
  ['fijo','fijoMes','prest','prestCuota','importKey','auto','ingP','ingMes'].forEach(k=>{if(F[k]!==undefined&&F[k]!==null&&F[k]!=='')o[k]=F[k]});
  if(F.tipo==='gasto'){o.cat=F.cat;o.metodo=F.metodo;const cr=met(F.metodo)?.tipo==='credito';o.cuotas=cr?Math.max(1,F.cuotas):1;S.cfg.ultMet=F.metodo;
    if(cr&&F.plastico&&(met(F.metodo).adicionales||[]).includes(F.plastico))o.plastico=F.plastico;
    if(cr&&F.ancla){o.ancla=F.ancla;o.pend=Math.min(o.cuotas,F.pend||o.cuotas);if(F.impCuota)o.impCuota=F.impCuota}}
  if(F.tipo==='ingreso'){o.cat=F.cat;o.destino=F.destino;S.cfg.ultDest=F.destino}
  if(F.tipo==='transf'){o.origen=F.origen;o.destino=F.destino}
  S.cfg.ultQuien=F.quien;
  const ix=S.movs.findIndex(m=>m.id===o.id);const prev=ix>=0?S.movs[ix]:null;if(ix>=0)S.movs[ix]=o;else S.movs.push(o);cloudTrack(prev,o);
  save();closeSheet();toast(F.id?'Actualizado ✔':'Guardado ✔');

/* ---- Parser de resúmenes ---- */
const MESN={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,set:9,oct:10,nov:11,dic:12,jan:1,apr:4,aug:8,dec:12};
function parseFecha(s,anioRef){
  let m=s.match(/\b(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?\b/);let d,mo,y;
  if(m){d=+m[1];mo=+m[2];y=m[3]?+m[3]:null;if(d>31||mo>12){if(+m[1]>1900){return null}return null}}
  else{m=s.match(/\b(\d{1,2})[\s\-\/.]*(ene|feb|mar|abr|may|jun|jul|ago|sep|set|oct|nov|dic|jan|apr|aug|dec)[a-z]*[\s\-\/.]*(\d{2,4})?\b/i);if(!m){m=s.match(/\b(\d{4})-(\d{2})-(\d{2})\b/);if(m)return{f:m[1]+'-'+m[2]+'-'+m[3],raw:m[0]};return null}d=+m[1];mo=MESN[m[2].toLowerCase().slice(0,3)];y=m[3]?+m[3]:null}
  if(y&&y<100)y+=2000;
  if(!y){y=anioRef||new Date().getFullYear();const f=new Date(y,mo-1,d);if(f-new Date()>45*864e5)y--}
  if(!mo||!d||mo>12||d>31)return null;
  return{f:y+'-'+pad(mo)+'-'+pad(d),raw:m[0]};
}
function parseMonto(s){
  const re=/(-?\s?\$?\s?(?:\d{1,3}(?:\.\d{3})+|\d+),\d{2}-?)|(-?\s?\$?\s?(?:\d{1,3}(?:,\d{3})+|\d+)\.\d{2}-?)/g;let m,last=null;
  while((m=re.exec(s)))last=m;if(!last)return null;
  let t=last[0];const neg=/-/.test(t);t=t.replace(/[\s$-]/g,'');
  let v=last[1]?+t.replace(/\./g,'').replace(',','.'):+t.replace(/,/g,'');
  return{v:neg?-v:v,raw:last[0],idx:last.index};
}
function parseCuota(s){const m=s.match(/\b(?:C(?:uota)?\.?\s?|cuota\s)(\d{1,2})\s?(?:\/|de)\s?(\d{1,2})\b/i)||s.match(/\b(\d{2})\/(\d{2})\b(?=\s+[\d$-])/);if(m&&+m[1]<=+m[2]&&+m[2]>1&&+m[2]<=48)return{c:+m[1],n:+m[2],raw:m[0]};return null}
function parseTexto(txt,anioRef){
  const out=[];const lines=String(txt).split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  let delim=null;const sample=lines.slice(0,10).join('\n');
  if((sample.match(/;/g)||[]).length>=lines.slice(0,10).length)delim=';';else if((sample.match(/\t/g)||[]).length>=lines.slice(0,10).length)delim='\t';
  let colImp=-1;
  lines.forEach(l=>{
    if(delim){const f=l.split(delim).map(x=>x.replace(/^"|"$/g,'').trim());
      if(colImp<0&&!parseFecha(f.join(' '),anioRef)){f.forEach((x,i)=>{if(/importe|monto|amount|valor|neto/i.test(x))colImp=i});return}
      let fe=null;for(const x of f){fe=parseFecha(x,anioRef);if(fe)break}if(!fe)return;
      let mo=null;if(colImp>=0)mo=parseMonto(f[colImp]||'')||(/^-?\d+(\.\d+)?$/.test(f[colImp])?{v:+f[colImp]}:null);
      if(!mo)for(let i=f.length-1;i>=0;i--){if(parseFecha(f[i],anioRef))continue;mo=parseMonto(f[i])||(/^-?\d+(\.\d+)?$/.test(f[i])&&f[i].length<12?{v:+f[i]}:null);if(mo)break}
      if(!mo||!mo.v)return;
      const desc=f.filter(x=>!parseFecha(x,anioRef)&&!/^[-\d.,$\s]+$/.test(x)).sort((a,b)=>b.length-a.length)[0]||'';
      const cu=parseCuota(l);out.push({fecha:fe.f,desc:desc.slice(0,80),importe:mo.v,c:cu?.c||null,n:cu?.n||null,inc:true,mon:/U\$S|USD|D[OÓ]LAR/i.test(l)?'USD':'ARS'});return}
    const fe=parseFecha(l,anioRef);if(!fe)return;const mo=parseMonto(l);if(!mo||!mo.v)return;
    const cu=parseCuota(l);
    let desc=l.replace(fe.raw,' ').replace(mo.raw,' ');if(cu)desc=desc.replace(cu.raw,' ');
    desc=desc.replace(/(-?\$?\s?(?:\d{1,3}(?:\.\d{3})+|\d+),\d{2}-?)/g,' ').replace(/\b\d{5,}\b/g,' ').replace(/\s+/g,' ').trim();
    out.push({fecha:fe.f,desc:desc.slice(0,80),importe:mo.v,c:cu?.c||null,n:cu?.n||null,inc:true,mon:/U\$S|USD|D[OÓ]LAR/i.test(l)?'USD':'ARS'});
  });
  return out;
}
async function pdfTexto(file){
  const lib=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs');
  lib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
  const pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise;let txt='';
  for(let p=1;p<=pdf.numPages;p++){const pg=await pdf.getPage(p);const tc=await pg.getTextContent();const rows={};
    tc.items.forEach(it=>{const y=Math.round(it.transform[5]/3)*3;(rows[y]=rows[y]||[]).push({x:it.transform[4],s:it.str})});
    Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>{txt+=rows[y].sort((a,b)=>a.x-b.x).map(o=>o.s).join(' ')+'\n'})}

  const conSigno=r.lineas.some(l=>l.importe<0);
  const ok=[],sinReg=[],aj=[];const costos={total:0,items:[]};
  const L=r.lineas.map((l,i)=>Object.assign({i},l)).sort((a,b)=>(b.n?1:0)-(a.n?1:0));
  const enCiclo=c=>!cr||!r.cierre||!c.cierre||Math.abs(dayDiff(c.cierre,r.cierre))<=6;
  const pend=[];
  L.forEach(l=>{const a=Math.abs(l.importe);const sg=conSigno?(l.importe<0?-1:1):0;const lm=l.mon||'ARS';let best=null,bs=1e9;
    C.forEach(c=>{if(used.has(c.key))return;if(lm!==(c.mon||'ARS'))return;const diff=Math.abs(a-c.imp);const tol=Math.max(1.5,c.imp*0.01);if(diff>tol)return;
      if(sg&&c.sg&&sg!==c.sg)return;
      if(l.n&&c.n&&(l.n!==c.n||l.c!==c.c))return;
      const dd=Math.abs(dayDiff(l.fecha,c.fecha));let s=diff/tol;
      if(cr){if(!enCiclo(c)&&!l.n)s+=3;if(dd>10&&!l.n&&!c.mov.ancla)return;s+=c.mov.ancla?0:dd/10}
      else{if(dd>6)return;s+=dd/6}
      if(s<bs){bs=s;best=c}});
    if(best){used.add(best.key);ok.push({l,c:best})}else pend.push(l)});
  // segunda pasada: importes estimados (gastos fijos variables) por nombre parecido
  const tok=s=>norm(s).replace(/\d+/g,'');
  pend.forEach(l=>{const lt=tok(l.desc);const c=C.find(c=>!used.has(c.key)&&c.est&&(l.mon||'ARS')===(c.mon||'ARS')&&Math.abs(dayDiff(l.fecha,c.fecha))<=12&&enCiclo(c)&&(()=>{const ct=tok(c.mov.desc);return ct.length>=3&&lt.length>=3&&(lt.includes(ct.slice(0,6))||ct.includes(lt.slice(0,6)))})());
    if(c){used.add(c.key);aj.push({l,c})}
    else{if(COSTOS.test(l.desc)&&(cr?l.importe>0:(conSigno?l.importe<0:true))){costos.total+=conv(Math.abs(l.importe),l.mon,'ARS');costos.items.push(l)}sinReg.push(l)}});
  let falt=[];
  if(cr&&r.cierre)falt=C.filter(c=>!used.has(c.key)&&c.sg===1&&enCiclo(c));
  else if(r.lineas.length){const fs=r.lineas.map(l=>l.fecha).sort();falt=C.filter(c=>!used.has(c.key)&&c.fecha>=fs[0]&&c.fecha<=fs[fs.length-1])}
  ok.forEach(o=>o.c.mov._c=true);aj.forEach(o=>o.c.mov._c=true);
  return{ok,sinReg,falt,costos,aj,lineas:r.lineas.length};
}

function sugerencias(){
  const out=[];const ym=MES_ACT;const t=totales(ym);const prev=ultMeses(4).slice(0,3);
  const prevI=prev.map(p=>totales(p).i).filter(Boolean);const ingProm=prevI.length?prevI.reduce((a,b)=>a+b,0)/prevI.length:t.i;
  if(t.i&&t.g>t.i)out.push({e:'🚨',n:'b',t:'Gastaste más de lo que ingresó',p:`Déficit de ${fmt(t.g-t.i)} en ${MESL[+ym.slice(5)-1]}. Revisá las categorías que más crecieron.`});
  else if(t.i&&(t.i-t.g)/t.i<0.1)out.push({e:'⚠️',n:'w',t:'Ahorro menor al 10%',p:`Ahorraste ${Math.round((t.i-t.g)/t.i*100)}% del ingreso. Objetivo razonable: 15–20%.`});
  // cuotas futuras vs ingreso
  const tarj=S.metodos.filter(x=>x.tipo==='credito');const hoy=today();
  const[y,m]=hoy.split('-').map(Number);const[a,b]=addM(y,m-1,1);const nx=a+'-'+pad(b+1);
  const cuotasNx=tarj.flatMap(x=>cuotasTarjeta(x.id)).filter(q=>q.venc.slice(0,7)===nx&&q.n>1).reduce((s,q)=>s+q.importe,0);
  if(ingProm&&cuotasNx/ingProm>0.25)out.push({e:'📅',n:'b',t:'Mucho ingreso comprometido en cuotas',p:`El mes próximo ya tenés ${fmt(cuotasNx)} en cuotas (${Math.round(cuotasNx/ingProm*100)}% de tu ingreso promedio). Evitá sumar cuotas nuevas hasta bajar del 20%.`});
  // categorías en alza
  catBreak(ym).filter(c=>c.id&&c.id!=='prest'&&c.id!=='seguros').forEach(c=>{const pr=prev.map(p=>movsMes(p).filter(x=>x.tipo==='gasto'&&x.cat===c.id).reduce((s,x)=>s+ars(x),0));const pi=prev.map(p=>totales(p).i);
    const shareAct=t.i?c.v/t.i:null;const sharePr=pi.reduce((s,v,i)=>s+(v?pr[i]/v:0),0)/Math.max(1,pi.filter(Boolean).length);
    const av=pr.reduce((s,v)=>s+v,0)/3;
    if(shareAct!==null&&sharePr>0&&shareAct>sharePr*1.3&&c.v>t.g*0.05)out.push({e:'📈',n:'w',t:`${c.l} subió en proporción al ingreso`,p:`Pasó de ${(sharePr*100).toFixed(1)}% a ${(shareAct*100).toFixed(1)}% de tus ingresos.`});
    else if(!t.i&&av&&c.v>av*1.4&&c.v>t.g*0.05)out.push({e:'📈',n:'w',t:`${c.l} +${Math.round((c.v/av-1)*100)}% vs promedio`,p:`${fmt(c.v)} contra ${fmt(av)} promedio (nominal, sin ajustar por inflación).`})});
  // gastos hormiga
  const hor=movsMes(ym).filter(x=>x.tipo==='gasto'&&ars(x)<=(+S.cfg.hormiga||5000));const hs=hor.reduce((s,x)=>s+ars(x),0);
  if(hor.length>=10)out.push({e:'🐜',n:'w',t:`${hor.length} gastos hormiga: ${fmt(hs)}`,p:`Compras de hasta ${fmt(S.cfg.hormiga)}. Son ${t.g?Math.round(hs/t.g*100):0}% del gasto del mes. Fijá un tope semanal en efectivo.`});
  // suscripciones / recurrentes
  const rec={};S.movs.filter(x=>x.tipo==='gasto'&&x.desc).forEach(x=>{const k=x.desc.toLowerCase().replace(/\d+/g,'').trim();(rec[k]=rec[k]||new Set()).add(x.fecha.slice(0,7))});
  const norm=x=>x.desc.toLowerCase().replace(/\d+/g,'').trim();const recs=Object.entries(rec).filter(([k,s])=>{if(s.size<3||k.length<3)return false;const v=S.movs.filter(x=>x.tipo==='gasto'&&x.desc&&norm(x)===k).map(ars);return Math.max(...v)/Math.min(...v)<=1.25});
  if(recs.length){const tot=recs.reduce((s,[k])=>{const l=S.movs.filter(x=>x.tipo==='gasto'&&x.desc&&x.desc.toLowerCase().replace(/\d+/g,'').trim()===k).sort(ordMov)[0];return s+(l?ars(l):0)},0);
    out.push({e:'🔁',n:'',t:`${recs.length} gastos recurrentes (~${fmt(tot)}/mes)`,p:`${recs.slice(0,6).map(r=>esc(r[0])).join(', ')}. Revisá cuáles podés cancelar, bajar de plan o compartir en familia.`})}
  // costos bancarios en resúmenes
  const cost=S.resumenes.reduce((s,r)=>s+conciliar(r).costos.total,0);
  const costMov=S.movs.filter(x=>x.tipo==='gasto'&&x.cat==='banco'&&x.fecha.slice(0,7)===ym).reduce((s,x)=>s+ars(x),0);
  if(cost+costMov>0)out.push({e:'🏦',n:'b',t:`Costos financieros detectados: ${fmt(cost+costMov)}`,p:'Intereses, comisiones, IVA, sellos o percepciones. Pagar el total de la tarjeta y negociar bonificación de mantenimiento suele eliminarlos.'});
  // efectivo
  const ef=efectivoMes(ym);if(ef.ret>0&&ef.dif>ef.ret*0.2)out.push({e:'💵',n:'w',t:`${fmt(ef.dif)} de efectivo sin registrar`,p:`Retiraste ${fmt(ef.ret)} y cargaste ${fmt(ef.gas)} en gastos. Hacé un arqueo en Conciliar → Efectivo.`});

    if(d>=0&&d<=3)out.push({e:'🗓️',n:'g',t:`${prox.x.nombre} cierra en ${d===0?'hoy':d+' días'}`,p:'Si podés postergar una compra grande hasta después del cierre, la pagás ~30 días más tarde. Con inflación, financiar sin interés a fin de ciclo te favorece.'})}
  {const cf=cashflow(6);const ng=cf.find(r=>r.fin<0);if(ng)out.unshift({e:'🚨',n:'b',t:`Cashflow: saldo negativo en ${MESL[+ng.ym.slice(5)-1]}`,p:`Con los ingresos y compromisos cargados faltarían ${fmt(-ng.fin)}. Mirá el detalle en Cashflow proyectado.`});
   else if(!S.ingProy.length&&S.movs.length>20)out.push({e:'💧',n:'',t:'Cargá tus ingresos proyectados',p:'Con sueldo, aguinaldo y otros cobros cargados en la Agenda, la app proyecta tu saldo mes a mes y te avisa faltantes.'})}
  // carga de deuda y fijos
  {const nx2=ymAdd(today().slice(0,7),1);const pr=S.prestamos.reduce((a,p)=>{const c=cuotaPrestamo(p,nx2);return a+(c?conv(+p.cuota,p.moneda,'ARS'):0)},0);
   const deuda=pr+cuotasNx;if(ingProm&&pr>0&&deuda/ingProm>0.3)out.push({e:'🏛️',n:'b',t:`Deuda: ${Math.round(deuda/ingProm*100)}% del ingreso`,p:`El mes próximo pagás ${fmt(pr)} de préstamos y ${fmt(cuotasNx)} de cuotas de tarjeta. Por encima de 30–35% conviene no tomar deuda nueva y priorizar cancelar la de mayor tasa.`});
   const mens=S.fijos.filter(f=>f.activo!==false).reduce((a,f)=>a+fMens(f),0);
   if(ingProm&&mens/ingProm>0.4){const top=[...S.fijos].filter(f=>f.activo!==false).sort((a,b)=>conv(b.importe,b.moneda,'ARS')/(b.freq||1)-conv(a.importe,a.moneda,'ARS')/(a.freq||1)).slice(0,3).map(f=>esc(f.nombre)).join(', ');
     out.push({e:'📌',n:'w',t:`Gastos fijos: ${Math.round(mens/ingProm*100)}% del ingreso`,p:`Equivalen a ${fmt(mens)}/mes. Los más pesados: ${top}. Revisá planes, pago anual con descuento (patente, inmobiliario suelen tenerlo) y seguros cotizando otra compañía.`})}
   const usd=movsMes(ym).filter(x=>x.tipo==='gasto'&&x.moneda==='USD'&&met(x.metodo)?.tipo==='credito').reduce((a,x)=>a+x.importe,0);
   if(usd>0)out.push({e:'💵',n:'',t:`Consumos en dólares con tarjeta: ${fmt2(usd,'USD')}`,p:'Si tenés dólares, cancelá ese saldo en USD: evitás el tipo de cambio de la tarjeta y posibles percepciones. Verificá con tu banco el régimen vigente.'})}
  // concentración de gastos por categoría sin registro de descripción
  const sinDesc=movsMes(ym).filter(x=>x.tipo==='gasto'&&!x.desc).length;const nG=movsMes(ym).filter(x=>x.tipo==='gasto').length;
  if(nG>10&&sinDesc/nG>0.5)out.push({e:'✍️',n:'',t:'Agregá descripción a tus gastos',p:'Más de la mitad no tiene detalle: la conciliación y la detección de recurrentes funcionan mucho mejor con el nombre del comercio.'});
  return out;
}

async function inflateRaw(u8){const st=new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return new Uint8Array(await new Response(st).arrayBuffer())}

  for(let i=0;i<cnt;i++){const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    const name=td.decode(u.subarray(p+46,p+46+nl));const lnl=dv.getUint16(off+26,true),lel=dv.getUint16(off+28,true);const st=off+30+lnl+lel;files[name]={method,data:u.subarray(st,st+csize)};p+=46+nl+el+cl}
  return async n=>{const f=files[n];if(!f)return null;return td.decode(f.method===8?await inflateRaw(f.data):f.data)}}

function copiarConfig(){const c=CFG();const t=`window.CC_CONFIG = {\n  supabaseUrl: ${JSON.stringify(c.supabaseUrl)},\n  supabaseKey: ${JSON.stringify(c.supabaseKey)},\n  vapidPublic: ${JSON.stringify(c.vapidPublic)}\n};\n`;window._ccTxt=t;

async function genVapid(){try{const k=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);const j=await crypto.subtle.exportKey('jwk',k.privateKey);const pub=u8b64u(await crypto.subtle.exportKey('raw',k.publicKey));
    const priv=JSON.stringify({kty:j.kty,crv:j.crv,x:j.x,y:j.y,d:j.d});if($('#svV'))$('#svV').value=pub;S.cfg.cloudCfg=Object.assign({},S.cfg.cloudCfg,{vapidPublic:pub});save();window._ccPriv=priv;window._ccPub=pub;
    dlg(`<h3>🔑 Claves de notificación</h3><p class="small" style="margin-top:0"><b>1. Privada</b> → Supabase → Edge Functions → Secrets → nombre <b>VAPID_PRIVATE_JWK</b>. No la compartas con nadie.</p><textarea class="in" rows="3" readonly>${esc(priv)}</textarea><button class="btn sm sec mt" onclick="navigator.clipboard.writeText(_ccPriv).then(()=>toast('Privada copiada'))">Copiar privada</button>
     <p class="small"><b>2. Pública</b> → ya quedó cargada en el campo y va en config.js.</p><textarea class="in" rows="2" readonly>${esc(pub)}</textarea>
     <div class="actions"><button class="btn" onclick="dlgClose()">Listo</button></div>`)}catch(x){toast('No se pudieron generar: '+x.message)}}

function placeStep(s){const r=s.el.getBoundingClientRect();const p=6;const ho=$('#tourHole');const top=Math.max(4,r.top-p),bot=Math.min(innerHeight-4,r.bottom+p);
  Object.assign(ho.style,{left:(r.left-p)+'px',top:top+'px',width:(r.width+p*2)+'px',height:Math.max(20,bot-top)+'px'});
  const b=$('#tourBub');const n=TOUR.st.length,i=TOUR.i;
  b.innerHTML=`<div class="small">${n>1?(i+1)+' de '+n:''}</div><b style="font-size:16px;display:block;margin:2px 0 6px">${s.t}</b><div style="font-size:14px;line-height:1.5;color:var(--ink2);max-height:40vh;overflow:auto">${s.x}</div>
   <div class="row" style="margin-top:12px;gap:8px"><button class="btn sm ghost" onclick="endTour()">${i===n-1?'Cerrar':'Saltar'}</button><span style="flex:1"></span>${i?'<button class="btn sm sec" onclick="TOUR.i--;showStep()" aria-label="Anterior">‹</button>':''}<button class="btn sm" onclick="nextStep()">${i===n-1?'¡Entendido!':'Siguiente ›'}</button></div>`;
  const bw=Math.min(330,innerWidth-24);b.style.width=bw+'px';const bh=b.offsetHeight;let y=bot+12;if(y+bh>innerHeight-8)y=top-bh-12;if(y<8)y=Math.max(8,innerHeight-bh-8);
  b.style.top=y+'px';b.style.left=Math.max(12,Math.min(innerWidth-bw-12,r.left+r.width/2-bw/2))+'px';b.style.opacity=1}
function nextStep(){if(TOUR.i<TOUR.st.length-1){TOUR.i++;showStep()}else endTour()}
function endTour(){if(!TOUR)return;S.cfg.vistos=S.cfg.vistos||{};S.cfg.vistos[TOUR.key]=1;save();document.body.style.overflow=$('#sheetBg').classList.contains('on')?'hidden':'';TOUR=null;$('#tourOv').style.display='none';setTimeout(maybeTour,500)}
function maybeTour(){if(TOUR||S.cfg.ayudaAuto===false)return;if($('#sheetBg').classList.contains('on')||$('#dlgBg').classList.contains('on'))return;const v=S.cfg.vistos||{};
  if(!v.nav)return startTour('nav');if(!v[VIEW]&&TOURS[VIEW])startTour(VIEW)}
window.addEventListener('resize',()=>{if(TOUR)placeStep(TOUR.st[TOUR.i])});

const TUT=[

 ['➕','Anotar es la clave',`<p>Cada vez que gastes, tocá el botón <b>+</b> de abajo:</p><ol><li>Elegí <b>Gasto</b>.</li><li>Escribí el <b>importe</b>.</li><li>Elegí <b>con qué pagaste</b> y <b>en qué</b>.</li><li>Tocá <b>Guardar</b>.</li></ol><div class="ej">🛒 <b>Ejemplo:</b> súper $45.000 con Visa → <b>+</b> → 45000 → Visa → Supermercado → Guardar. Listo, 5 segundos.</div>`],
 ['💳','Tarjetas sin misterio',`<p>Toda tarjeta tiene dos fechas:</p><ul><li><b>Cierre</b>: el día que "corta" y arma el resumen.</li><li><b>Vencimiento</b>: el último día para pagarlo.</li></ul><div class="tl"><div style="background:var(--goodSoft)">Comprás<br><b>20/11</b></div>→<div style="background:var(--warnSoft)">Cierre<br><b>24/11</b></div>→<div style="background:var(--badSoft)">Pagás<br><b>5/12</b></div></div><p>Si comprás el <b>26/11</b> (después del cierre), lo pagás recién el <b>5/1</b>. En <b>cuotas</b>, la app reparte cada cuota en su mes.</p>`],
 ['💵','El efectivo',`<p>Sacar plata del cajero <b>no es un gasto</b>: la plata sigue siendo tuya, solo pasa de la cuenta a la billetera.</p><ol><li>Al sacar: <b>+</b> → <b>Extracción</b> (Cuenta → Efectivo).</li><li>Al gastar ese efectivo: <b>+</b> → Gasto → Efectivo.</li></ol><div class="ej">🔎 Si sacaste $100.000 y anotaste $70.000, la app te avisa que <b>$30.000 se fueron sin saber en qué</b>.</div>`],
 ['📌','La Agenda',`<p>Cargá <b>una sola vez</b> lo que se repite:</p><ul><li><b>Gastos fijos</b>: colegio, luz, gas, internet, impuestos, seguros.</li><li><b>Préstamos</b> de cuota fija.</li><li><b>Ingresos</b>: sueldo, aguinaldo, alquileres.</li></ul><p>Cada mes la Agenda te muestra qué vence, qué cobrás y qué ya pagaste. Con un toque lo marcás como pagado.</p>`],
 ['💧','Cashflow: ¿me alcanza?',`<p>La app proyecta cuánta plata vas a tener a fin de cada mes:</p><div class="ej" style="text-align:center;font-size:15px">Lo que tenés hoy<br><b style="color:var(--good)">+ lo que vas a cobrar</b><br><b style="color:var(--bad)">− lo que vas a pagar</b><br>= <b>lo que te va a quedar</b></div><p>Si algún mes da negativo, te avisa con tiempo para que puedas ajustar.</p>`],
 ['🔗','Conciliar el resumen',`<p>Cuando te llega el resumen de la tarjeta o del banco, subilo en <b>Conciliar</b>. La app lo compara con lo que anotaste:</p><ul><li>✔ Coincide.</li><li>⚠ Está en el resumen y <b>no lo anotaste</b> → lo cargás con un toque.</li><li>✖ Lo anotaste y <b>no aparece</b> (quizás entra el mes que viene).</li><li>🏦 Comisiones e intereses que te cobraron.</li></ul>`],
 ['📊','Análisis y consejos',`<p>En <b>Análisis</b> ves gráficos de tus gastos y propuestas concretas, por ejemplo:</p><ul><li>🐜 <b>Gastos hormiga</b>: cafés, kioscos y compras chicas que sumadas pesan.</li><li>🔁 Suscripciones que quizás no usás.</li><li>🏦 Comisiones bancarias evitables.</li><li>📅 Si estás tomando demasiadas cuotas.</li></ul>`],
 ['🔒','Tus datos',`<p>Todo se guarda <b>solo en tu teléfono</b>. Nadie más puede verlo.</p><p>Por eso es importante hacer un <b>respaldo</b> una vez por mes: Ajustes ⚙️ → Respaldo → Exportar, y guardá el archivo (mandátelo por mail o WhatsApp).</p>`],
 ['🚀','Primeros pasos',`<ol><li><b>Ajustes ⚙️</b>: dejá solo tus tarjetas y cuentas. En cada tarjeta poné día de <b>cierre</b>, de <b>vencimiento</b> y los <b>adicionales</b>.</li><li>Cargá el <b>saldo inicial</b> de cada cuenta (lo que tenés hoy).</li><li><b>Agenda</b>: cargá sueldo, gastos fijos y préstamos.</li><li>Desde hoy, anotá cada gasto con <b>+</b>.</li></ol><div class="ej">💡 En cada sección, el botón <b class="hi" style="display:inline-block">i</b> te explica para qué sirve. Y el <b>?</b> de arriba abre esta ayuda.</div>`]

function openTutorial(i){i=Math.max(0,Math.min(TUT.length-1,i));const[e,t,b]=TUT[i];const last=i===TUT.length-1;
  $('#sheet').innerHTML=`<div class="grab"></div><h3><span class="small">Tutorial · ${i+1} de ${TUT.length}</span><button class="x" onclick="closeSheet()">✕</button></h3>
  <div class="slide" id="slide"><div class="big">${e}</div><h4>${t}</h4>${b}</div>
  <div class="dots">${TUT.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}</div>
  <div class="actions">${i?`<button class="btn ghost" onclick="openTutorial(${i-1})">‹ Anterior</button>`:`<button class="btn ghost" onclick="closeSheet()">Ahora no</button>`}<button class="btn" onclick="${last?"closeSheet();go('ajustes')":`openTutorial(${i+1})`}">${last?'Ir a Ajustes':'Siguiente ›'}</button></div>`;
  openSheet();$('#sheet').scrollTop=0;const sl=$('#sheet');let x0=null;sl.ontouchstart=ev=>{x0=ev.touches[0].clientX};sl.ontouchend=ev=>{if(x0===null)return;const dx=ev.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>60&&$('#slide'))openTutorial(dx<0?i+1:i-1)}}
const GLOS=[['Saldo','La plata que hay en una cuenta en un momento dado. En una tarjeta, el saldo es lo que debés.'],['Liquidez','La plata que podés usar ya: cuentas, billeteras virtuales y efectivo. No incluye inversiones ni lo que te deben.'],
 ['Ingreso','Plata que entra: sueldo, honorarios, alquileres, reintegros.'],['Gasto','Plata que sale porque compraste o pagaste algo.'],['Extracción','Sacar efectivo del cajero. No es un gasto: la plata pasa de tu cuenta a tu billetera.'],['Transferencia','Mover plata de una cuenta a otra. Entre cuentas tuyas tampoco es gasto.'],
 ['Cierre de la tarjeta','El día en que la tarjeta arma el resumen con todo lo comprado desde el cierre anterior. Lo que compres después pasa al resumen siguiente.'],['Vencimiento','El último día para pagar el resumen sin recargos.'],['Resumen de tarjeta','El "estado de cuenta" mensual: lista de compras, cuotas, impuestos y el total a pagar.'],
 ['Pago mínimo','El monto más chico que el banco te deja pagar. Lo que no pagás genera <b>intereses muy altos</b>. Siempre que puedas, pagá el total.'],['Cuotas','Pagar una compra en partes, una por mes. "Sin interés" significa que la suma de las cuotas es igual al precio de contado.'],['Adicional','Una tarjeta extra a nombre de otra persona (por ejemplo, tu pareja) que usa la misma cuenta del titular. Todo se paga en un mismo resumen.'],
 ['Débito automático','Un pago que se cobra solo cada mes, de la tarjeta o de la cuenta (seguros, servicios, suscripciones).'],['Gasto fijo','Un gasto que se repite con regularidad: colegio, servicios, impuestos, cuotas.'],['Gasto variable','Un gasto que cambia mes a mes, como la luz o el gas.'],['Gasto corriente','Lo que gastás en el día a día: súper, comida, combustible, salidas.'],
 ['Gasto hormiga','Gastos chicos y frecuentes (café, kiosco, delivery) que parecen insignificantes pero sumados pesan mucho.'],['Conciliar','Comparar lo que anotaste con lo que dice el banco o la tarjeta, para encontrar diferencias.'],['Arqueo','Contar el efectivo que tenés y compararlo con lo que deberías tener según tus anotaciones.'],
 ['Cashflow (flujo de fondos)','La proyección de cuánta plata va a entrar y salir cada mes, y cuánta te va a quedar.'],['Préstamo de cuota fija','Préstamo que se devuelve con la misma cuota todos los meses (sistema francés). Al principio la cuota es casi todo interés; al final, casi todo capital.'],
 ['Capital','La plata que te prestaron, sin contar intereses.'],['Interés','Lo que te cobran por prestarte plata (o lo que te pagan por prestarla vos).'],['TNA','Tasa Nominal Anual: el porcentaje de interés por año que informa el banco. Sirve para comparar préstamos.'],
 ['Aguinaldo','Sueldo anual complementario: medio sueldo extra que se cobra en junio y otro en diciembre.'],['Tipo de cambio','Cuántos pesos vale un dólar. La app lo usa para sumar gastos en dólares a tus totales en pesos.'],['Inflación','La suba general de precios. Con inflación, los mismos pesos compran menos cada mes.'],
 ['Respaldo','Una copia de tus datos en un archivo, para recuperarlos si cambiás o perdés el teléfono.']];

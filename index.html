<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2457d6">
<meta name="description" content="Finanzas personales y familiares: gastos, cuotas, tarjetas, conciliación de resúmenes y efectivo.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cuentas Claras</title>
<style>
:root{
  --bg:#f4f5f9;--card:#ffffff;--ink:#111318;--ink2:#52545e;--muted:#8a8d99;--line:#e6e7ee;
  --pri:#2a3fbf;--pri2:#4f63e6;--priSoft:#e8ebff;
  --good:#0f8a4b;--goodSoft:#e3f6ec;--warn:#b86e00;--warnSoft:#fff3dd;--bad:#c62f2f;--badSoft:#fde8e8;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#9a9ca6;
  --r:18px;--shadow:0 2px 10px rgba(20,24,60,.07);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#111216;--card:#1b1c22;--ink:#f0efec;--ink2:#c3c2b7;--muted:#8f909a;--line:#2c2d35;
  --pri:#6f7ff0;--pri2:#8b98f5;--priSoft:#262a4a;
  --good:#3fc181;--goodSoft:#173326;--warn:#f0ad3c;--warnSoft:#3a2d15;--bad:#ef6b6b;--badSoft:#3d1c1c;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#2a9a2a;--s7:#9085e9;--s8:#6f717c;
  --shadow:none;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#2a3fbf,#5b3fd1);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 12px 14px;display:flex;align-items:center;gap:7px}
header.top h1{font-size:17px;margin:0;flex:1;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mes{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.16);border-radius:999px;padding:2px}
.mes button{background:none;border:0;color:#fff;width:30px;height:32px;border-radius:50%;font-size:18px;cursor:pointer}
.mes span{min-width:62px;text-align:center;font-weight:600;font-size:14px}
main{padding:14px;max-width:760px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--ink2);display:flex;gap:6px;align-items:center}
.kpi .v{font-size:20px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.pos{color:var(--good)}.neg{color:var(--bad)}
nav.bot{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.bot button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:4px 2px;min-width:50px;flex:1;cursor:pointer}
nav.bot button .i{font-size:21px;line-height:1}
nav.bot button.on{color:var(--pri);font-weight:600}
nav.bot .fab{flex:none!important;min-width:0!important;background:linear-gradient(135deg,#2a3fbf,#5b3fd1);color:#fff;width:58px;height:58px;border-radius:50%;margin-top:-26px;font-size:30px;box-shadow:0 6px 18px rgba(42,63,191,.4);justify-content:center}
.row{display:flex;align-items:center;gap:10px}
.list .it{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--priSoft)}
.it .tx{flex:1;min-width:0}
.it .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .t2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .am{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.it .am small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.day{font-size:12px;color:var(--muted);font-weight:600;margin:12px 4px 4px;text-transform:capitalize}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;background:var(--priSoft);color:var(--pri);font-weight:600}
.chip.g{background:var(--goodSoft);color:var(--good)}.chip.w{background:var(--warnSoft);color:var(--warn)}.chip.b{background:var(--badSoft);color:var(--bad)}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--pri);color:#fff}
.btn.sec{background:var(--priSoft);color:var(--pri)}
.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--line)}
.btn.danger{background:var(--badSoft);color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font-weight:600;color:var(--ink2);cursor:pointer;font-size:14px}
.seg button.on{background:var(--card);color:var(--pri);box-shadow:var(--shadow)}
.seg.gasto button.on{color:var(--bad)}.seg .ing.on{color:var(--good)!important}
label.f,div.f{display:block;margin:12px 0 0}
label.f>span,div.f>span{display:block;font-size:12px;color:var(--ink2);margin-bottom:5px;font-weight:600}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;outline:none}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--pri)}
.amount{font-size:34px;font-weight:800;text-align:center;border:0!important;background:transparent!important;padding:6px!important;font-variant-numeric:tabular-nums}
.grid-chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.gc{overflow-wrap:anywhere;hyphens:auto;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;cursor:pointer;text-align:center;line-height:1.15;min-height:64px;justify-content:center}
.gc .e{font-size:22px}
.gc.on{border-color:var(--pri);background:var(--priSoft);color:var(--pri);font-weight:600}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.pill{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 13px;cursor:pointer;font-size:13px;white-space:nowrap}
.pill.on{border-color:var(--pri);background:var(--pri);color:#fff;font-weight:600}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:20px;cursor:pointer}
.stepper b{min-width:30px;text-align:center;font-size:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,30,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:0 0 8px;font-size:18px;display:flex;align-items:center}
.sheet h3 .x{margin-left:auto;background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted)}
.actions{display:flex;gap:10px;margin-top:16px;position:sticky;bottom:0;background:var(--card);padding-top:10px}
.actions .btn{flex:1}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;z-index:90;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.empty .e{font-size:40px}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:9px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px}
.legend .lg{display:flex;align-items:center;gap:8px}
.legend .dot{width:10px;height:10px;border-radius:3px;flex:none}
.legend .lg .n{flex:1;color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .lg b{font-variant-numeric:tabular-nums}
.donutwrap{display:grid;grid-template-columns:130px minmax(0,1fr);gap:14px;align-items:center}
.sug{display:flex;gap:12px;padding:12px;border-radius:14px;margin-bottom:8px;background:var(--bg);border:1px solid var(--line)}
.sug .e{font-size:22px}
.sug>div>b{display:block;margin-bottom:2px}
.sug p{margin:0;font-size:13px;color:var(--ink2)}
.sug.w{background:var(--warnSoft);border-color:transparent}.sug.b{background:var(--badSoft);border-color:transparent}.sug.g{background:var(--goodSoft);border-color:transparent}
.cc{border-radius:16px;padding:14px;color:#fff;margin-bottom:10px;position:relative;overflow:hidden}
.cc .n{font-weight:700}.cc .s{font-size:12px;opacity:.85}
.cc .v{font-size:22px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.cc .bdg{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.22);padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t td,table.t th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.small{font-size:12px;color:var(--muted)}
.tip{position:fixed;z-index:95;background:#1d1e26;color:#fff;font-size:12px;padding:6px 9px;border-radius:8px;pointer-events:none;display:none;white-space:nowrap}
.tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
hr.s{border:0;border-top:1px solid var(--line);margin:12px 0}
svg text{font-family:inherit}
.mt{margin-top:10px}.mb{margin-bottom:10px}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.hbtn{background:rgba(255,255,255,.18);border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:17px;font-weight:800;cursor:pointer;flex:none}
.hi{border:0;background:var(--priSoft);color:var(--pri);width:22px;height:22px;border-radius:50%;font:700 13px/22px Georgia,serif;font-style:italic;cursor:pointer;padding:0;flex:none;vertical-align:middle;margin-left:2px}
.tour-ov{position:fixed;inset:0;z-index:120;display:none}
.tour-hole{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(10,12,30,.66);outline:3px solid #fff;transition:all .28s ease;pointer-events:none}
.tour-bub{position:fixed;background:var(--card);color:var(--ink);border-radius:18px;padding:14px 15px;box-shadow:0 12px 36px rgba(0,0,0,.35);transition:top .25s,left .25s}
.slide{text-align:center;padding:4px 4px 0}
.slide .big{font-size:58px;line-height:1.1;margin:6px 0}
.slide h4{font-size:20px;margin:6px 0 8px}
.slide p,.slide li{font-size:15px;line-height:1.5;color:var(--ink2);text-align:left}
.slide ol,.slide ul{padding-left:20px;margin:6px 0}
.slide .ej{background:var(--priSoft);border-radius:14px;padding:10px 12px;text-align:left;font-size:14px;margin-top:10px}
.dots{display:flex;justify-content:center;gap:6px;margin:14px 0 4px}
.dots i{width:7px;height:7px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--pri);width:20px}
.tl{display:flex;align-items:center;gap:4px;margin:10px 0;font-size:12px}
.tl div{flex:1;border-radius:10px;padding:7px 4px;text-align:center}
.gl dt{font-weight:700;margin-top:12px}.gl dd{margin:3px 0 0;color:var(--ink2);font-size:14px;line-height:1.45}

/* ===== v4 · estilo billetera ===== */
:root{--bg:#eef0f5;--line:#e4e6ee;--pri:#2457d6;--pri2:#3b6cf0;--priSoft:#e6edfd;--r:16px;--shadow:0 1px 3px rgba(20,30,60,.07),0 1px 1px rgba(20,30,60,.04);--hc:#2457d6}
body[data-hc=bad]{--hc:#cf3a3a}body[data-hc=vio]{--hc:#5b45c9}
:root[data-theme="dark"]{--bg:#0e1014;--card:#1a1c22;--line:#2a2c34;--pri:#7d9cf7;--pri2:#9ab3fa;--priSoft:#1d2846}
:root[data-theme="dark"] body{--hc:#1d3a86}:root[data-theme="dark"] body[data-hc=bad]{--hc:#862a2a}:root[data-theme="dark"] body[data-hc=vio]{--hc:#3d3189}
header.top{background:var(--hc)!important;padding-bottom:10px}
.card,.kpi{border:0}:root[data-theme="dark"] .card,:root[data-theme="dark"] .kpi,:root[data-theme="dark"] .spot{border:1px solid var(--line)}
nav.bot .fab{background:var(--pri)!important;box-shadow:0 4px 14px rgba(36,87,214,.35)}
.btn{background:var(--pri)}
.hero{margin:-14px -14px 0;padding:2px 18px 42px;background:var(--hc);color:#fff}
.hero .hl{font-size:12.5px;opacity:.88}.hero .hv{font-size:30px;font-weight:800;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums}.hero .hs{font-size:12.5px;opacity:.9;margin-top:2px}
.ovl{margin-top:-30px;position:relative}
.pseg{display:flex;gap:4px;margin-top:4px}.pseg button{flex:1;border:0;border-radius:999px;padding:6px 0;background:rgba(255,255,255,.17);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer}.pseg button.on{background:#fff;color:var(--hc)}
.lbl{font-size:12.5px;color:var(--ink2);font-weight:700;margin:14px 4px 6px}
.home{display:flex;flex-direction:column;min-height:var(--avail,0px)}
.home .hhome{padding-bottom:34px;min-height:34px}
.g22 .spot{justify-content:flex-start}.g22 .spot>div:last-child{margin-top:auto;margin-bottom:auto}
.g22 .spot svg{height:clamp(54px,10.5vh,108px);width:auto}
.ctl{font-size:clamp(12px,1.55vh,13.5px)!important;line-height:1.75!important}
.dbig{display:flex;justify-content:center;padding:4px 0 8px}.dbig svg{width:min(78vw,280px);height:auto}
.lgb{display:grid;grid-template-columns:minmax(0,1fr);gap:7px;font-size:13.5px}.lgb>div{display:flex;align-items:center;gap:6px;min-width:0}.lgb i{width:9px;height:9px;border-radius:3px;flex:none}.lgb .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}.lgb b{font-variant-numeric:tabular-nums;white-space:nowrap}.lgb .p{color:var(--muted);font-size:12px;width:34px;text-align:right;flex:none}
.gdn{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}.gdn .lgm{width:100%}
.ctl>div span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-height:700px){.ss2{display:none}.gdn{flex-direction:row}.g22 .spot svg{height:52px}}

.ovl>.lbl:first-child{color:rgba(255,255,255,.92);margin-top:0}.home .ovl{flex:1;display:flex;flex-direction:column;gap:8px}
.spot{background:var(--card);border-radius:16px;padding:11px 12px;box-shadow:var(--shadow);cursor:pointer;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:4px;border:1px solid transparent}
.spot.alert{border-color:var(--bad)!important}
.spot .sl{font-size:12.5px;color:var(--ink2);display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.spot .sl .ch{color:var(--muted);font-size:16px;line-height:1}
.spot .sv{font-size:clamp(16px,2.5vh,21px);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spot .sv.big{font-size:clamp(21px,3.4vh,27px)}
.spot .ss{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g22{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-auto-rows:1fr;gap:8px}
.chips3{display:flex;gap:6px}.chips3 span{flex:1;text-align:center;background:var(--bg);border-radius:9px;padding:5px 2px;font-size:11.5px;white-space:nowrap;color:var(--ink2);overflow:hidden}
.sbar{display:flex;gap:2px;height:7px;border-radius:9px;overflow:hidden;margin:5px 0 4px;background:var(--line)}.sbar i{display:block;height:100%}
.lgm{font-size:11.5px;line-height:1.55;min-width:0;flex:1}.lgm>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lgm i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:4px}.lgm b{font-weight:700}
.ctl{font-size:12px;line-height:1.5}.ctl>div{display:flex;justify-content:space-between;gap:6px}.ctl span{color:var(--ink2)}.ctl b{font-variant-numeric:tabular-nums;white-space:nowrap}
.spot.libre{flex-direction:row;align-items:center;gap:10px;background:var(--goodSoft)}.spot.libre .sl,.spot.libre .sv{color:var(--good)}.spot.libre .li{font-size:24px}
.spot.libre .ins{font-size:11.5px;color:var(--good);text-align:right;line-height:1.35;white-space:nowrap}
.spot.libre.mal{background:var(--badSoft)}.spot.libre.mal .sl,.spot.libre.mal .sv,.spot.libre.mal .ins{color:var(--bad)}
.rub{padding:8px 0;border-bottom:1px solid var(--line)}.rub:last-of-type{border-bottom:0}.rub .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.rbar{display:flex;height:8px;border-radius:9px;background:var(--bg);overflow:hidden;margin-top:5px}.rbar i{display:block;height:100%}
.cmp{font-size:11px;font-weight:700;color:var(--muted);margin-left:2px}.cmp.neg{color:var(--bad)}.cmp.pos{color:var(--good)}
details.card>summary{font-weight:700;font-size:13px;color:var(--ink2)}
.priv .amt,.priv .kpi .v,.priv .it .am,.priv .cc .v,.priv td.n,.priv .hero .hv{filter:blur(7px)}
</style>
</head>
<body>
<header class="top">
  <button id="backBtn" class="hbtn" onclick="atras()" aria-label="Volver" style="display:none;font-size:22px;line-height:1">‹</button>
  <h1 id="ttl">Cuentas Claras</h1>
  <div class="mes" id="mesSel"><button onclick="moveMes(-1)" aria-label="Mes anterior">‹</button><span id="mesLbl"></span><button onclick="moveMes(1)" aria-label="Mes siguiente">›</button></div>
  <button id="eyeBtn" class="hbtn" data-h="eye" onclick="togPriv()" aria-label="Ocultar importes" style="font-size:16px">👁</button>
  <button id="helpBtn" class="hbtn" onclick="openAyuda()" aria-label="Ayuda">?</button>
</header>
<main id="view"></main>
<nav class="bot">
  <button data-v="inicio" onclick="go('inicio')"><span class="i">🏠</span>Inicio</button>
  <button data-v="movs" onclick="go('movs')"><span class="i">📋</span>Movim.</button>
  <button class="fab" data-h="fab" onclick="openMov()" aria-label="Cargar movimiento">+</button>
  <button data-v="anal" onclick="go('anal')"><span class="i">📊</span>Análisis</button>
  <button data-v="ajustes" data-h="gear" onclick="go('ajustes')"><span class="i">⚙️</span>Ajustes</button>
</nav>
<div class="sheet-bg" id="sheetBg" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>

function cierreDe(m,y,mo){

  return{cierre:ymd(c),venc:ymd(v)};
}

    const c=ciclo(m,d,0);const fake={id:'est_'+f.id+ym,desc:f.nombre,cat:f.cat,fecha:d,est:true,plastico:f.plastico||'',moneda:f.moneda||M1(),importe:+f.importe||0,fijo:f.id};

function resumenesTarjeta(m,desde,cant,pl){

    if(c.mon===M2())r.usd+=c.imp;else r.ars+=c.imp;r.total+=c.importe;r.items.push(c)};
  cuotasTarjeta(m.id).forEach(add);estimadosFijos(m.id,12).forEach(add);

function saldos(){
  const b={},bu={};S.metodos.forEach(m=>{b[m.id]=+m.saldoInicial||0;bu[m.id]=m.tipo==='credito'?(+m.saldoInicialUSD||0):0});
  const cuentaDe=id=>{const m=met(id);return m&&m.tipo==='debito'&&m.cuenta?m.cuenta:id};
  const monDe=id=>met(id)?.moneda||M1();
  const cred=(id,v,mon,sg)=>{if((mon||M1())===M2())bu[id]+=sg*v;else b[id]+=sg*v};
  const acc=(id,mv,sg)=>{if(b[id]===undefined)return;b[id]+=sg*conv(+mv.importe||0,mv.moneda,monDe(id))};
  S.movs.forEach(mv=>{
    if(mv.tipo==='gasto'){const m=met(mv.metodo);if(!m)return;
      if(m.tipo==='credito'){let v=+mv.importe||0;if(mv.ancla){const n=+mv.cuotas||1,p=+mv.pend||n;v=mv.impCuota?mv.impCuota*p:v*p/n}cred(m.id,v,mv.moneda,1)}
      else acc(cuentaDe(m.id),mv,-1)}
    else if(mv.tipo==='ingreso')acc(cuentaDe(mv.destino),mv,1);
    else if(mv.tipo==='transf'){const o=met(mv.origen),d=met(mv.destino);
      if(o){if(o.tipo==='credito')cred(o.id,+mv.importe,mv.moneda,1);else acc(cuentaDe(o.id),mv,-1)}
      if(d){if(d.tipo==='credito')cred(d.id,+mv.importe,mv.moneda,-1);else acc(cuentaDe(d.id),mv,1)}}
  });
  b._usd=bu;return b;
}
const movsMes=(ym)=>S.movs.filter(m=>!m.ancla&&m.fecha.slice(0,7)===ym);
function totales(ym){let g=0,i=0;movsMes(ym).forEach(m=>{if(m.tipo==='gasto')g+=ars(m);else if(m.tipo==='ingreso')i+=ars(m)});return{g,i}}
function efectivoMes(ym){
  const ef=S.metodos.filter(m=>m.tipo==='efectivo').map(m=>m.id);let ret=0,gas=0,ing=0,sal=0;
  movsMes(ym).forEach(m=>{const v=ars(m);
    if(m.tipo==='transf'&&ef.includes(m.destino))ret+=v;
    if(m.tipo==='transf'&&ef.includes(m.origen))sal+=v;
    if(m.tipo==='ingreso'&&ef.includes(m.destino))ing+=v;
    if(m.tipo==='gasto'&&ef.includes(m.metodo))gas+=v});
  return{ret,gas,ing,sal,dif:ret+ing-gas-sal};
}

function donut(data,size){

  const r=size/2-10,cx=size/2,cy=size/2,w=22;let a0=-Math.PI/2;let p='';
  data.forEach(d=>{const a=d.v/tot*Math.PI*2;const gap=data.length>1?0.025:0;const s=a0+gap/2,e=a0+a-gap/2;
    if(data.length===1){p+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.c}" stroke-width="${w}" data-tip="${esc(d.l)}: ${fmt(d.v)} (100%)"/>`}
    else{const large=e-s>Math.PI?1:0;const x1=cx+r*Math.cos(s),y1=cy+r*Math.sin(s),x2=cx+r*Math.cos(e),y2=cy+r*Math.sin(e);
    p+=`<path d="M${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)}" fill="none" stroke="${d.c}" stroke-width="${w}" data-tip="${esc(d.l)}: ${fmt(d.v)} (${Math.round(d.v/tot*100)}%)"/>`}
    a0+=a});

}

  const adic=S.metodos.filter(esAdic);if(adic.length)h+=`<div class="lbl">Tarjetas que te comparten</div><div class="card"><div class="list">${adic.map(m=>{const v=C.s[m.id]||0;return`<div class="it" onclick="openTarjeta('${m.id}')"><div class="ico">🔗</div><div class="tx"><div class="t1">${esc(m.nombre)}</div><div class="t2">El resumen lo paga ${esc(m.compartida.titular)}</div></div><div class="am">${fmt(v)}<small>tus consumos</small></div></div>`}).join('')}</div></div>`;
  h+=`<div class="lbl">Compromisos · <span class="amt">${fmt(C.comp)}</span></div><div class="card"><div class="list">${C.pr.map(x=>`<div class="it" onclick="openPrest('${x.p.id}')"><div class="ico">🏛️</div><div class="tx"><div class="t1">${esc(x.p.nombre)}</div><div class="t2">${x.e.rest} cuotas restantes · cuota ${fmt(x.p.cuota,x.p.moneda)}</div></div><div class="am neg">− ${fmt(x.v)}<small>${x.e.cap!==null?'capital pendiente':'resta pagar'}</small></div></div>`).join('')}
   ${C.V>0.5?`<div class="it" onclick="go('dven')"><div class="ico">🔴</div><div class="tx"><div class="t1">Deudas vencidas</div><div class="t2">${C.vc.length} gastos fijos o pagos atrasados ›</div></div><div class="am neg">− ${fmt(C.V)}</div></div>`:''}

const fdia=s=>{const d=parseYmd(s);return EN()?MES[d.getMonth()]+' '+d.getDate():d.getDate()+' '+MES[d.getMonth()]};
const icoMet=m=>({credito:'💳',debito:'💳',cuenta:'🏦',billetera:'📱',efectivo:'💵'}[m.tipo]);
const ordMov=(a,b)=>(b.fecha+(b.hora||''))>(a.fecha+(a.hora||''))?1:-1;
function itemMov(mv){
  let ic,t1,t2,am,cl;
  if(mv.tipo==='gasto'){const c=cat(mv.cat);ic=c.e;t1=mv.desc||c.nombre;t2=c.nombre+' · '+(met(mv.metodo)?.nombre||'?')+(mv.plastico?' ('+mv.plastico+')':'')+(mv.cuotas>1?' · '+mv.cuotas+' cuotas':'');am='-'+fmt(mv.importe,mv.moneda);cl='neg'}
  else if(mv.tipo==='ingreso'){const c=cat(mv.cat);ic=c.e;t1=mv.desc||c.nombre;t2='→ '+(met(mv.destino)?.nombre||'?');am='+'+fmt(mv.importe,mv.moneda);cl='pos'}
  else{const o=met(mv.origen),d=met(mv.destino);ic=d&&d.tipo==='efectivo'?'🏧':d&&d.tipo==='credito'?'✅':'🔁';t1=mv.desc||(d&&d.tipo==='efectivo'?'Extracción':d&&d.tipo==='credito'?'Pago de tarjeta':'Transferencia');t2=(o?.nombre||'?')+' → '+(d?.nombre||'?');am=fmt(mv.importe,mv.moneda);cl=''}
  const conc=(mv.compartido?'<span class="chip" style="font-size:10px;padding:1px 6px">🔗 '+esc(mv.compartido.autor)+'</span> ':'')+(mv._c?'<span class="chip g" style="font-size:10px;padding:1px 6px">✔</span> ':'')+(mv.est?'<span class="chip w" style="font-size:10px;padding:1px 6px">estimado</span> ':'')+(mv.fijo||mv.prest?'📌 ':'');
  return`<div class="it" onclick="openMov('${mv.id}')"><div class="ico">${ic}</div><div class="tx"><div class="t1">${conc}${esc(t1)}</div><div class="t2">${esc(t2)}${mv.quien&&S.miembros.length>1?' · '+esc(mv.quien):''}</div></div><div class="am ${cl}">${am}<small>${fdia(mv.fecha)} ${mv.hora||''}</small></div></div>`;
}

/* ============ Agenda: gastos fijos, débitos automáticos y préstamos ============ */
const FREQ={1:'Mensual',2:'Bimestral',3:'Trimestral',6:'Semestral',12:'Anual',0:'Una sola vez'};
const fq=f=>(f.freq===0||f.freq==='0')?0:(+f.freq||1);
const fMens=f=>fq(f)?conv(+f.importe||0,f.moneda,M1())/fq(f):0;
function fijoVence(f,ym){if(f.activo===false||!f.desde)return null;const d=ymDiff(ym,f.desde);const q=fq(f);if(d<0||(q===0?d!==0:d%q))return null;if(f.hasta&&ym>f.hasta)return null;const[y,m]=ym.split('-').map(Number);return ymd(mkDate(y,m-1,+f.dia||1))}
const pagoFijo=(f,ym)=>S.movs.find(x=>x.fijo===f.id&&x.fijoMes===ym);
function cuotaPrestamo(p,ym){if(!p.proxima)return null;const d=ymDiff(ym,p.proxima.slice(0,7));const k=(+p.pagadas||0)+1+d;if(d<0||k>+p.n)return null;const[y,m]=ym.split('-').map(Number);return{k,fecha:ymd(mkDate(y,m-1,+p.dia||+p.proxima.slice(8)))}}
const pagoPrest=(p,k)=>S.movs.find(x=>x.prest===p.id&&x.prestCuota===k);
function estadoPrestamo(p){const pApp=cuotasPagadasApp(p);const pag=(+p.pagadas||0)+pApp;const rest=Math.max(0,(+p.n||0)-pag);
  let cap=null,intP=null;const i=(+p.tna||0)/1200;
  if(i>0&&+p.cuota){const P=+p.capital||p.cuota*(1-Math.pow(1+i,-p.n))/i;cap=Math.max(0,P*Math.pow(1+i,pag)-p.cuota*(Math.pow(1+i,pag)-1)/i);intP=cap*i}
  const fin=p.proxima?ymAdd(p.proxima.slice(0,7),pApp+rest-1):'';
  return{pag,rest,nominal:rest*(+p.cuota||0),cap,intP,fin}}
function generarAuto(){let n=0;const hoy=today(),ymH=hoy.slice(0,7);
  S.fijos.forEach(f=>{if(!f.auto||f.activo===false||!f.desde)return;const c0=f.creadoF||hoy;let ym=f.desde>c0.slice(0,7)?f.desde:c0.slice(0,7);
    for(let g=0;ym<=ymH&&g<60;g++,ym=ymAdd(ym,1)){const d=fijoVence(f,ym);if(!d||d>hoy||d<c0||pagoFijo(f,ym)||S.skip[f.id+'|'+ym])continue;
      const mv={id:uid(),tipo:'gasto',fecha:d,hora:'',importe:+f.importe||0,moneda:f.moneda||M1(),cat:f.cat||'otros',metodo:f.metodo,desc:f.nombre,cuotas:1,quien:f.quien||S.miembros[0],fijo:f.id,fijoMes:ym,auto:1};
      if(f.variable)mv.est=true;if(f.plastico)mv.plastico=f.plastico;S.movs.push(mv);n++}});
  S.prestamos.forEach(p=>{if(!p.auto||!p.proxima)return;const c0=p.creadoF||hoy;let ym=p.proxima.slice(0,7);
    for(let g=0;ym<=ymH&&g<240;g++,ym=ymAdd(ym,1)){const c=cuotaPrestamo(p,ym);if(!c||c.fecha>hoy||c.fecha<c0||pagoPrest(p,c.k)||S.skip['p'+p.id+'|'+c.k])continue;
      S.movs.push({id:uid(),tipo:'gasto',fecha:c.fecha,hora:'',importe:+p.cuota,moneda:p.moneda||M1(),cat:'prest',metodo:p.cuenta,desc:p.nombre+(EN()?' installment ':' cuota ')+c.k+'/'+p.n,cuotas:1,quien:S.miembros[0],prest:p.id,prestCuota:c.k,auto:1});n++}});
  S.ingProy.forEach(f=>{if(!f.auto||f.activo===false||!f.desde)return;const c0=f.creadoF||hoy;let ym=f.desde>c0.slice(0,7)?f.desde:c0.slice(0,7);
    for(let g=0;ym<=ymH&&g<60;g++,ym=ymAdd(ym,1)){const d=fijoVence(f,ym);if(!d||d>hoy||d<c0||cobroIng(f,ym)||S.skip['i'+f.id+'|'+ym])continue;
      const mv={id:uid(),tipo:'ingreso',fecha:d,hora:'',importe:+f.importe||0,moneda:f.moneda||M1(),cat:f.cat||'oting',destino:f.destino,desc:f.nombre,quien:S.miembros[0],ingP:f.id,ingMes:ym,auto:1};if(f.variable)mv.est=true;S.movs.push(mv);n++}});
  if(n){save();setTimeout(()=>toast(`📌 ${n} débito${n>1?'s':''} automático${n>1?'s':''} registrado${n>1?'s':''}`),900)}return n}
const cobroIng=(f,ym)=>S.movs.find(x=>x.ingP===f.id&&x.ingMes===ym);
function cobrosMes(ym){const hoy=today();const it=[];
  S.ingProy.forEach(f=>{if(f.creadoF&&ym<f.creadoF.slice(0,7))return;const d=fijoVence(f,ym);if(!d)return;const mv=cobroIng(f,ym);const sk=S.skip['i'+f.id+'|'+ym];
    it.push({f,ym,fecha:d,mov:mv,monto:mv?ars(mv):conv(+f.importe||0,f.moneda,M1()),estado:(mv||sk)?'cobrado':d<hoy?'atrasado':'pendiente'})});
  return it.sort((a,b)=>a.fecha<b.fecha?-1:1)}
function actCobro(c){const f=c.f;const fe=c.fecha<=today()?c.fecha:today();
  return `openMov(null,{tipo:'ingreso',cat:'${f.cat||'oting'}',destino:'${f.destino||''}',importe:${f.variable?"''":(+f.importe||"''")},moneda:'${f.moneda||M1()}',desc:'${esc(f.nombre)}',fecha:'${fe}',ingP:'${f.id}',ingMes:'${c.ym}'})`}
function itemCobro(c){const f=c.f;const chip={cobrado:'<span class="chip g">✔ cobrado</span>',pendiente:'<span class="chip">pendiente</span>',atrasado:'<span class="chip w">atrasado</span>'}[c.estado];
  return`<div class="it" onclick="event.stopPropagation();${c.mov?`openMov('${c.mov.id}')`:actCobro(c)}"><div class="ico" style="background:var(--goodSoft)">${cat(f.cat).e}</div><div class="tx"><div class="t1">${esc(f.nombre)}</div><div class="t2">${fdia(c.fecha)} · → ${esc(met(f.destino)?.nombre||'?')}${f.auto?' · automático':''}</div></div><div class="am pos">${c.mov?'':(f.variable?'~':'')}${fmt(c.mov?c.mov.importe:f.importe,f.moneda)}<div style="margin-top:3px">${c.estado==='cobrado'?chip:`<button class="btn sm sec" onclick="event.stopPropagation();${actCobro(c)}">Registrar cobro</button>`}</div></div></div>`}
let IF=null;
function openIng(id){const f=id?S.ingProy.find(x=>x.id===id):null;
  IF=f?JSON.parse(JSON.stringify(f)):{id:null,nombre:'',cat:'sueldo',destino:S.metodos.find(m=>m.tipo==='cuenta')?.id||S.metodos[0].id,moneda:M1(),importe:'',variable:false,dia:1,freq:1,desde:today().slice(0,7),hasta:'',auto:false,activo:true};
  drawIng();openSheet()}
function drawIng(){const f=IF;

  <label class="f"><span>Concepto</span><div class="grid-chips">${S.cats.filter(c=>c.tipo==='ingreso').map(c=>`<div class="gc ${f.cat===c.id?'on':''}" onclick="IF.cat='${c.id}';drawIng()"><span class="e">${c.e}</span>${esc(c.nombre)}</div>`).join('')}</div></label>
  <label class="f"><span>¿Dónde se deposita?</span><select class="in" onchange="IF.destino=this.value">${S.metodos.filter(x=>x.tipo==='cuenta'||x.tipo==='billetera'||x.tipo==='efectivo').map(x=>`<option value="${x.id}" ${f.destino===x.id?'selected':''}>${icoMet(x)} ${esc(x.nombre)}</option>`).join('')}</select></label>
  <div class="two"><label class="f"><span>Importe ${f.variable?'estimado':''}</span><input class="in" inputmode="decimal" value="${f.importe===''?'':String(f.importe).replace('.',DS())}" oninput="IF.importe=numIn(this.value)"></label><label class="f"><span>Moneda</span><select class="in" onchange="IF.moneda=this.value">${monList().map(c=>`<option ${f.moneda===c?'selected':''}>${c}</option>`).join('')}</select></label></div>
  <label class="f"><span>Tipo de importe</span><div class="seg"><button class="${!f.variable?'on':''}" onclick="IF.variable=false;drawIng()">Fijo</button><button class="${f.variable?'on':''}" onclick="IF.variable=true;drawIng()">Variable / estimado</button></div></label>
  <div class="two"><label class="f"><span>Día de cobro</span><input class="in" type="number" min="1" max="31" value="${f.dia}" onchange="IF.dia=+this.value"></label><label class="f"><span>Frecuencia</span><select class="in" onchange="IF.freq=+this.value">${[1,2,3,6,12,0].map(k=>`<option value="${k}" ${fq(f)===k?'selected':''}>${FREQ[k]}</option>`).join('')}</select></label></div>
  <div class="two"><label class="f"><span>${fq(f)===0?'Mes de cobro':'Primer cobro (mes)'}</span><input class="in" type="month" value="${f.desde}" onchange="IF.desde=this.value"></label>${fq(f)===0?'<div></div>':`<label class="f"><span>Hasta (opcional)</span><input class="in" type="month" value="${f.hasta||''}" onchange="IF.hasta=this.value"></label>`}</div>
  <div class="small mt">Aguinaldo: frecuencia <b>Semestral</b>, primer cobro <b>junio</b>, día 30 (cobra junio y diciembre). Bono o venta puntual: <b>Una sola vez</b>.</div>
  <label class="f"><span>Registro</span><div class="seg"><button class="${f.auto?'on':''}" onclick="IF.auto=true;drawIng()">Automático</button><button class="${!f.auto?'on':''}" onclick="IF.auto=false;drawIng()">Lo confirmo yo</button></div></label>
  <div class="small mt">${f.auto?'Se registra solo en la fecha (útil para acreditaciones seguras). Si cambia el importe, editás el movimiento.':'Aparece en la Agenda como cobro pendiente y lo confirmás con el importe real.'}</div>
  ${f.id?`<label class="f"><span>Estado</span><div class="seg"><button class="${f.activo!==false?'on':''}" onclick="IF.activo=true;drawIng()">Activo</button><button class="${f.activo===false?'on':''}" onclick="IF.activo=false;drawIng()">Pausado / baja</button></div></label>`:''}
  <div class="actions">${f.id?`<button class="btn danger" style="flex:0 0 auto" onclick="delIng()">🗑</button>`:''}<button class="btn" onclick="saveIng()">Guardar</button></div>`;
  $('#sheet').innerHTML=h}
function saveIng(){const f=IF;if(!f.nombre.trim())return toast('Poné un nombre');if(!(+f.importe>0))return toast('Ingresá el importe');if(!f.desde)return toast('Indicá el mes');
  f.nombre=f.nombre.trim();f.freq=fq(f);if(f.freq===0)f.hasta='';if(!f.id){f.id=uid();f.creadoF=today();S.ingProy.push(f)}else S.ingProy[S.ingProy.findIndex(x=>x.id===f.id)]=f;generarAuto();save();closeSheet();render();toast('Guardado ✔')}
async function delIng(){if(!await ask('¿Eliminar este ingreso proyectado? Los cobros registrados se conservan.','Eliminar',1))return;S.ingProy=S.ingProy.filter(x=>x.id!==IF.id);save();closeSheet();render()}

/* ============ Cashflow proyectado ============ */
const LIQ=m=>m.tipo==='cuenta'||m.tipo==='billetera'||m.tipo==='efectivo';
function liquidezHoy(){const s=saldos();return S.metodos.filter(LIQ).reduce((a,m)=>a+conv(s[m.id]||0,m.moneda||M1(),M1()),0)}
const esCorriente=x=>x.tipo==='gasto'&&!x.ancla&&!x.fijo&&!x.prest&&x.cat!=='prest'&&!((+x.cuotas||1)>1);
function corrienteAuto(){const ym0=today().slice(0,7);let t=0,k=0;for(let i=1;i<=3;i++){const ym=ymAdd(ym0,-i);const g=S.movs.filter(x=>esCorriente(x)&&x.fecha.slice(0,7)===ym).reduce((a,x)=>a+ars(x),0);if(g>0){t+=g;k++}}return k?t/k:0}
function corrienteMes(){return S.cfg.corriente!==undefined&&S.cfg.corriente!==null&&S.cfg.corriente!==''?+S.cfg.corriente:corrienteAuto()}
function cashflow(n){const hoy=today(),ym0=hoy.slice(0,7);const C=corrienteMes();const inf=(+S.cfg.infl||0)/100;const out=[];let saldo=liquidezHoy();
  for(let k=0;k<n;k++){const ym=ymAdd(ym0,k);const fx=Math.pow(1+inf,k);const r={ym,ing:0,tarj:0,prest:0,fijos:0,corr:0,det:{ing:[],tarj:[],prest:[],fijos:[]}};
    cobrosMes(ym).forEach(c=>{if(c.estado==='cobrado')return;r.ing+=c.monto;r.det.ing.push([c.f.nombre,c.monto,c.fecha])});
    S.metodos.filter(m=>m.tipo==='credito'&&!esAdic(m)).forEach(m=>{resumenesTarjeta(m,ym+'-01',40).filter(x=>x.venc.slice(0,7)===ym).forEach(x=>{let v=x.total;
      if(k===0){const lim=ymd(new Date(parseYmd(x.venc).getTime()+12*864e5));v=Math.max(0,v-S.movs.filter(t=>t.tipo==='transf'&&t.destino===m.id&&t.fecha>x.cierre&&t.fecha<=lim).reduce((a,t)=>a+ars(t),0))}
      if(v>0){r.tarj+=v;r.det.tarj.push([m.nombre,v,x.venc])}})});
    S.prestamos.forEach(p=>{const c=cuotaPrestamo(p,ym);if(!c)return;const e=estadoPrest(p,c.k);if(e.full)return;const v=e.resta;r.prest+=v;r.det.prest.push([p.nombre+' '+c.k+'/'+p.n,v,c.fecha])});
    S.fijos.forEach(f=>{const m=met(f.metodo);if(m&&m.tipo==='credito')return;const d=fijoVence(f,ym);if(!d)return;const e=estadoFijo(f,ym);if(e.full)return;const v=e.resta*fx;r.fijos+=v;r.det.fijos.push([f.nombre,v,d])});
    if(k===0){const g=S.movs.filter(x=>esCorriente(x)&&x.fecha.slice(0,7)===ym).reduce((a,x)=>a+ars(x),0);r.corr=Math.max(0,C-g);r.gastado=g}else r.corr=C*fx;
    if(k===0){const da=deudaAcum(ym);r.atras=da.atras;r.det.atras=da.venc.map(i=>[i.nombre+' ('+lblMes(i.mes)+')',i.resta,i.fecha])}else r.atras=0;
    r.egr=r.tarj+r.prest+r.fijos+r.corr+r.atras;r.neto=r.ing-r.egr;r.ini=saldo;saldo+=r.neto;r.fin=saldo;out.push(r)}
  return out}

function numIn(s){s=String(s).replace(/[^\d.,-]/g,'');if(!s||s==='-')return'';const lc=s.lastIndexOf(','),lp=s.lastIndexOf('.');let dec=null;
  if(lc>=0&&lp>=0)dec=lc>lp?',':'.';else if(lc>=0)dec=(EN()&&/^-?\d{1,3}(,\d{3})+$/.test(s))?null:',';else if(lp>=0)dec=(!EN()&&/^-?\d{1,3}(\.\d{3})+$/.test(s))?null:'.';
  if(dec===',')s=s.replace(/\./g,'').replace(',','.');else if(dec==='.')s=s.replace(/,/g,'');else s=s.replace(/[.,]/g,'');const v=+s;return isNaN(v)?'':v}

/* ---- Parser de resúmenes ---- */
const fechaFmt=()=>S.cfg.fechaFmt||(EN()&&M1()==='USD'?'mdy':'dmy');
const MESN={january:1,ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,set:9,oct:10,nov:11,dic:12,jan:1,apr:4,aug:8,dec:12};
function parseFecha(s,anioRef){
  let m=s.match(/\b(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?\b/);let d,mo,y;
  if(m){d=+m[1];mo=+m[2];if(fechaFmt()==='mdy'&&+m[1]<=12&&+m[2]>=1){d=+m[2];mo=+m[1]}else if(+m[2]>12&&+m[1]<=12){d=+m[2];mo=+m[1]}y=m[3]?+m[3]:null;if(d>31||mo>12)return null}
  else{m=s.match(/\b(\d{1,2})[\s\-\/.]*(ene|feb|mar|abr|may|jun|jul|ago|sep|set|oct|nov|dic|jan|apr|aug|dec)[a-z]*[\s\-\/.]*(\d{2,4})?\b/i);if(!m){m=s.match(/\b(\d{4})-(\d{2})-(\d{2})\b/);if(m)return{f:m[1]+'-'+m[2]+'-'+m[3],raw:m[0]};return null}d=+m[1];mo=MESN[m[2].toLowerCase().slice(0,3)];y=m[3]?+m[3]:null}
  if(y&&y<100)y+=2000;
  if(!y){y=anioRef||new Date().getFullYear();const f=new Date(y,mo-1,d);if(f-new Date()>45*864e5)y--}
  if(!mo||!d||mo>12||d>31)return null;
  return{f:y+'-'+pad(mo)+'-'+pad(d),raw:m[0]};
}
function parseMonto(s){
  const re=/(-?\s?\$?\s?(?:\d{1,3}(?:\.\d{3})+|\d+),\d{2}-?)|(-?\s?\$?\s?(?:\d{1,3}(?:,\d{3})+|\d+)\.\d{2}-?)/g;let m,last=null;
  while((m=re.exec(s)))last=m;if(!last)return null;
  let t=last[0];const neg=/-/.test(t);t=t.replace(/[\s$-]/g,'');
  let v=last[1]?+t.replace(/\./g,'').replace(',','.'):+t.replace(/,/g,'');
  return{v:neg?-v:v,raw:last[0],idx:last.index};
}
function parseCuota(s){const m=s.match(/\b(?:C(?:uota)?\.?\s?|cuota\s)(\d{1,2})\s?(?:\/|de)\s?(\d{1,2})\b/i)||s.match(/\b(\d{2})\/(\d{2})\b(?=\s+[\d$-])/);if(m&&+m[1]<=+m[2]&&+m[2]>1&&+m[2]<=48)return{c:+m[1],n:+m[2],raw:m[0]};return null}
function parseTexto(txt,anioRef){
  const out=[];const lines=String(txt).split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  let delim=null;const sample=lines.slice(0,10).join('\n');
  if((sample.match(/;/g)||[]).length>=lines.slice(0,10).length)delim=';';else if((sample.match(/\t/g)||[]).length>=lines.slice(0,10).length)delim='\t';
  let colImp=-1;
  lines.forEach(l=>{
    if(delim){const f=l.split(delim).map(x=>x.replace(/^"|"$/g,'').trim());
      if(colImp<0&&!parseFecha(f.join(' '),anioRef)){f.forEach((x,i)=>{if(/importe|monto|amount|valor|neto/i.test(x))colImp=i});return}
      let fe=null;for(const x of f){fe=parseFecha(x,anioRef);if(fe)break}if(!fe)return;
      let mo=null;if(colImp>=0)mo=parseMonto(f[colImp]||'')||(/^-?\d+(\.\d+)?$/.test(f[colImp])?{v:+f[colImp]}:null);
      if(!mo)for(let i=f.length-1;i>=0;i--){if(parseFecha(f[i],anioRef))continue;mo=parseMonto(f[i])||(/^-?\d+(\.\d+)?$/.test(f[i])&&f[i].length<12?{v:+f[i]}:null);if(mo)break}
      if(!mo||!mo.v)return;
      const desc=f.filter(x=>!parseFecha(x,anioRef)&&!/^[-\d.,$\s]+$/.test(x)).sort((a,b)=>b.length-a.length)[0]||'';
      const cu=parseCuota(l);out.push({fecha:fe.f,desc:desc.slice(0,80),importe:mo.v,c:cu?.c||null,n:cu?.n||null,inc:true,mon:isM2txt(l)?M2():M1()});return}
    const fe=parseFecha(l,anioRef);if(!fe)return;const mo=parseMonto(l);if(!mo||!mo.v)return;
    const cu=parseCuota(l);
    let desc=l.replace(fe.raw,' ').replace(mo.raw,' ');if(cu)desc=desc.replace(cu.raw,' ');
    desc=desc.replace(/(-?\$?\s?(?:\d{1,3}(?:\.\d{3})+|\d+),\d{2}-?)/g,' ').replace(/\b\d{5,}\b/g,' ').replace(/\s+/g,' ').trim();
    out.push({fecha:fe.f,desc:desc.slice(0,80),importe:mo.v,c:cu?.c||null,n:cu?.n||null,inc:true,mon:/U\$S|USD|D[OÓ]LAR/i.test(l)?M2():M1()});
  });
  return out;
}
async function pdfTexto(file){
  const lib=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs');
  lib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
  const pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise;let txt='';
  for(let p=1;p<=pdf.numPages;p++){const pg=await pdf.getPage(p);const tc=await pg.getTextContent();const rows={};
    tc.items.forEach(it=>{const y=Math.round(it.transform[5]/3)*3;(rows[y]=rows[y]||[]).push({x:it.transform[4],s:it.str})});
    Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>{txt+=rows[y].sort((a,b)=>a.x-b.x).map(o=>o.s).join(' ')+'\n'})}
  return txt;
}

/* ---- Matching ---- */
const COSTOS=/inter[eé]s|comisi[oó]n|\biva\b|sellos|impuesto|percep|mantenim|cargo|seguro de vida|punitorio|financ|db\.?\s?rg|ganancias|ley 25413|imp\.?\s?deb|imp\.?\s?cred/i;
function candidatos(r){
  const m=met(r.metodo);if(!m)return[];const c=[];
  const ids=[m.id].concat(S.metodos.filter(x=>x.tipo==='debito'&&x.cuenta===m.id).map(x=>x.id));
  S.movs.forEach(mv=>{const mon=mv.moneda||M1();
    if(mv.tipo==='gasto'&&ids.includes(mv.metodo)){if(m.tipo==='credito')cuotasDe(mv).forEach(q=>c.push({key:q.key,mov:mv,imp:q.imp,mon,fecha:mv.fecha,sg:1,c:q.i,n:q.n,cierre:q.cierre,est:!!mv.est}));else c.push({key:mv.id,mov:mv,imp:+mv.importe,mon,fecha:mv.fecha,sg:-1,est:!!mv.est})}
    else if(mv.tipo==='ingreso'&&ids.includes(mv.destino))c.push({key:mv.id,mov:mv,imp:+mv.importe,mon,fecha:mv.fecha,sg:1});
    else if(mv.tipo==='transf'){if(mv.origen===m.id)c.push({key:mv.id,mov:mv,imp:+mv.importe,mon,fecha:mv.fecha,sg:m.tipo==='credito'?1:-1});if(mv.destino===m.id)c.push({key:mv.id,mov:mv,imp:+mv.importe,mon,fecha:mv.fecha,sg:m.tipo==='credito'?-1:1})}
  });return c;
}
function conciliar(r){
  const m=met(r.metodo);const cr=m&&m.tipo==='credito';const C=candidatos(r);const used=new Set();
  const conSigno=r.lineas.some(l=>l.importe<0);
  const ok=[],sinReg=[],aj=[];const costos={total:0,items:[]};
  const L=r.lineas.map((l,i)=>Object.assign({i},l)).sort((a,b)=>(b.n?1:0)-(a.n?1:0));
  const enCiclo=c=>!cr||!r.cierre||!c.cierre||Math.abs(dayDiff(c.cierre,r.cierre))<=6;
  const pend=[];
  L.forEach(l=>{const a=Math.abs(l.importe);const sg=conSigno?(l.importe<0?-1:1):0;const lm=l.mon||M1();let best=null,bs=1e9;
    C.forEach(c=>{if(used.has(c.key))return;if(lm!==(c.mon||M1()))return;const diff=Math.abs(a-c.imp);const tol=Math.max(1.5,c.imp*0.01);if(diff>tol)return;
      if(sg&&c.sg&&sg!==c.sg)return;
      if(l.n&&c.n&&(l.n!==c.n||l.c!==c.c))return;
      const dd=Math.abs(dayDiff(l.fecha,c.fecha));let s=diff/tol;
      if(cr){if(!enCiclo(c)&&!l.n)s+=3;if(dd>10&&!l.n&&!c.mov.ancla)return;s+=c.mov.ancla?0:dd/10}
      else{if(dd>6)return;s+=dd/6}
      if(s<bs){bs=s;best=c}});
    if(best){used.add(best.key);ok.push({l,c:best})}else pend.push(l)});
  // segunda pasada: importes estimados (gastos fijos variables) por nombre parecido
  const tok=s=>norm(s).replace(/\d+/g,'');
  pend.forEach(l=>{const lt=tok(l.desc);const c=C.find(c=>!used.has(c.key)&&c.est&&(l.mon||M1())===(c.mon||M1())&&Math.abs(dayDiff(l.fecha,c.fecha))<=12&&enCiclo(c)&&(()=>{const ct=tok(c.mov.desc);return ct.length>=3&&lt.length>=3&&(lt.includes(ct.slice(0,6))||ct.includes(lt.slice(0,6)))})());
    if(c){used.add(c.key);aj.push({l,c})}
    else{if(COSTOS.test(l.desc)&&(cr?l.importe>0:(conSigno?l.importe<0:true))){costos.total+=conv(Math.abs(l.importe),l.mon,M1());costos.items.push(l)}sinReg.push(l)}});
  let falt=[];
  if(cr&&r.cierre)falt=C.filter(c=>!used.has(c.key)&&c.sg===1&&enCiclo(c));
  else if(r.lineas.length){const fs=r.lineas.map(l=>l.fecha).sort();falt=C.filter(c=>!used.has(c.key)&&c.fecha>=fs[0]&&c.fecha<=fs[fs.length-1])}
  ok.forEach(o=>o.c.mov._c=true);aj.forEach(o=>o.c.mov._c=true);
  return{ok,sinReg,falt,costos,aj,lineas:r.lineas.length};
}

  if(l.n&&l.c>1)toast('Cuota '+l.c+'/'+l.n+': ajustá la fecha a la de compra original');
  closeSheet();openMov(null,pre);F._after=()=>setTimeout(()=>openResumen(rid),50)}

/* ============ Análisis y sugerencias ============ */
function vAnal(){

  const ser=compromisos(fut);

  // por vía de pago

  if(S.miembros.length>1){const pq={};movsMes(MES_ACT).filter(x=>x.tipo==='gasto').forEach(x=>pq[x.quien||'—']=(pq[x.quien||'—']||0)+ars(x));const d=Object.entries(pq).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>({l:k,v,c:COLORS[i%8]}));
    h+=`<div class="card"><h2 data-h="porPersona">👨‍👩‍👧 Por persona${hi('porPersona')}</h2>${d.length?legend(d):'<div class="empty">Sin datos</div>'}</div>`}
  // top categorías con variación
  const prev=ultMeses(4).slice(0,3);const cb=catBreak(MES_ACT);
  h+=`<div class="card"><h2 data-h="catProm">🧩 Categorías vs promedio 3 meses previos${hi('catProm')}</h2>${cb.length?cb.filter(c=>c.id).map(c=>{const pr=prev.map(p=>movsMes(p).filter(x=>x.tipo==='gasto'&&x.cat===c.id).reduce((a,x)=>a+ars(x),0));const av=pr.reduce((a,b)=>a+b,0)/3;const v=av?Math.round((c.v/av-1)*100):null;const mx=cb[0].v;
    return`<div class="mb"><div class="row" style="font-size:13px"><span style="flex:1">${esc(c.l)}</span><b>${fmt(c.v)}</b>${v!==null?`<span class="chip ${v>15?'b':v<-10?'g':''}" style="margin-left:6px">${v>0?'+':''}${v}%</span>`:''}</div><div class="bar" style="margin-top:4px"><i style="width:${c.v/mx*100}%;background:${c.c}"></i></div></div>`}).join(''):'<div class="empty">Sin datos</div>'}</div>`;
  const sg=sugerencias();

function sugerencias(){
  const out=[];const ym=MES_ACT;const t=totales(ym);const prev=ultMeses(4).slice(0,3);
  const prevI=prev.map(p=>totales(p).i).filter(Boolean);const ingProm=prevI.length?prevI.reduce((a,b)=>a+b,0)/prevI.length:t.i;
  if(t.i&&t.g>t.i)out.push({e:'🚨',n:'b',t:'Gastaste más de lo que ingresó',p:`Déficit de ${fmt(t.g-t.i)} en ${MESL[+ym.slice(5)-1]}. Revisá las categorías que más crecieron.`});
  else if(t.i&&(t.i-t.g)/t.i<0.1)out.push({e:'⚠️',n:'w',t:'Ahorro menor al 10%',p:`Ahorraste ${Math.round((t.i-t.g)/t.i*100)}% del ingreso. Objetivo razonable: 15–20%.`});
  // cuotas futuras vs ingreso
  const tarj=S.metodos.filter(x=>x.tipo==='credito');const hoy=today();
  const[y,m]=hoy.split('-').map(Number);const[a,b]=addM(y,m-1,1);const nx=a+'-'+pad(b+1);
  const cuotasNx=tarj.flatMap(x=>cuotasTarjeta(x.id)).filter(q=>q.venc.slice(0,7)===nx&&q.n>1).reduce((s,q)=>s+q.importe,0);
  if(ingProm&&cuotasNx/ingProm>0.25)out.push({e:'📅',n:'b',t:'Mucho ingreso comprometido en cuotas',p:`El mes próximo ya tenés ${fmt(cuotasNx)} en cuotas (${Math.round(cuotasNx/ingProm*100)}% de tu ingreso promedio). Evitá sumar cuotas nuevas hasta bajar del 20%.`});
  // categorías en alza
  catBreak(ym).filter(c=>c.id&&c.id!=='prest'&&c.id!=='seguros').forEach(c=>{const pr=prev.map(p=>movsMes(p).filter(x=>x.tipo==='gasto'&&x.cat===c.id).reduce((s,x)=>s+ars(x),0));const pi=prev.map(p=>totales(p).i);
    const shareAct=t.i?c.v/t.i:null;const sharePr=pi.reduce((s,v,i)=>s+(v?pr[i]/v:0),0)/Math.max(1,pi.filter(Boolean).length);
    const av=pr.reduce((s,v)=>s+v,0)/3;
    if(shareAct!==null&&sharePr>0&&shareAct>sharePr*1.3&&c.v>t.g*0.05)out.push({e:'📈',n:'w',t:`${c.l} subió en proporción al ingreso`,p:`Pasó de ${(sharePr*100).toFixed(1)}% a ${(shareAct*100).toFixed(1)}% de tus ingresos.`});
    else if(!t.i&&av&&c.v>av*1.4&&c.v>t.g*0.05)out.push({e:'📈',n:'w',t:`${c.l} +${Math.round((c.v/av-1)*100)}% vs promedio`,p:`${fmt(c.v)} contra ${fmt(av)} promedio (nominal, sin ajustar por inflación).`})});
  // gastos hormiga
  const hor=movsMes(ym).filter(x=>x.tipo==='gasto'&&ars(x)<=(+S.cfg.hormiga||5000));const hs=hor.reduce((s,x)=>s+ars(x),0);
  if(hor.length>=10)out.push({e:'🐜',n:'w',t:`${hor.length} gastos hormiga: ${fmt(hs)}`,p:`Compras de hasta ${fmt(S.cfg.hormiga)}. Son ${t.g?Math.round(hs/t.g*100):0}% del gasto del mes. Fijá un tope semanal en efectivo.`});
  // suscripciones / recurrentes
  const rec={};S.movs.filter(x=>x.tipo==='gasto'&&x.desc).forEach(x=>{const k=x.desc.toLowerCase().replace(/\d+/g,'').trim();(rec[k]=rec[k]||new Set()).add(x.fecha.slice(0,7))});
  const norm=x=>x.desc.toLowerCase().replace(/\d+/g,'').trim();const recs=Object.entries(rec).filter(([k,s])=>{if(s.size<3||k.length<3)return false;const v=S.movs.filter(x=>x.tipo==='gasto'&&x.desc&&norm(x)===k).map(ars);return Math.max(...v)/Math.min(...v)<=1.25});
  if(recs.length){const tot=recs.reduce((s,[k])=>{const l=S.movs.filter(x=>x.tipo==='gasto'&&x.desc&&x.desc.toLowerCase().replace(/\d+/g,'').trim()===k).sort(ordMov)[0];return s+(l?ars(l):0)},0);
    out.push({e:'🔁',n:'',t:`${recs.length} gastos recurrentes (~${fmt(tot)}/mes)`,p:`${recs.slice(0,6).map(r=>esc(r[0])).join(', ')}. Revisá cuáles podés cancelar, bajar de plan o compartir en familia.`})}
  // costos bancarios en resúmenes
  const cost=S.resumenes.reduce((s,r)=>s+conciliar(r).costos.total,0);
  const costMov=S.movs.filter(x=>x.tipo==='gasto'&&x.cat==='banco'&&x.fecha.slice(0,7)===ym).reduce((s,x)=>s+ars(x),0);
  if(cost+costMov>0)out.push({e:'🏦',n:'b',t:`Costos financieros detectados: ${fmt(cost+costMov)}`,p:'Intereses, comisiones, IVA, sellos o percepciones. Pagar el total de la tarjeta y negociar bonificación de mantenimiento suele eliminarlos.'});
  // efectivo
  const ef=efectivoMes(ym);if(ef.ret>0&&ef.dif>ef.ret*0.2)out.push({e:'💵',n:'w',t:`${fmt(ef.dif)} de efectivo sin registrar`,p:`Retiraste ${fmt(ef.ret)} y cargaste ${fmt(ef.gas)} en gastos. Hacé un arqueo en Conciliar → Efectivo.`});
  // cuotas sin interés: aprovechar fechas de cierre
  if(tarj.length){const prox=tarj.map(x=>({x,c:ciclo(x,hoy,0)})).sort((p,q)=>q.c.cierre<p.c.cierre?-1:1)[0];const d=dayDiff(prox.c.cierre,hoy);
    if(d>=0&&d<=3)out.push({e:'🗓️',n:'g',t:`${prox.x.nombre} cierra en ${d===0?'hoy':d+' días'}`,p:'Si podés postergar una compra grande hasta después del cierre, la pagás ~30 días más tarde. Con inflación, financiar sin interés a fin de ciclo te favorece.'})}
  {const cf=cashflow(6);const ng=cf.find(r=>r.fin<0);if(ng)out.unshift({e:'🚨',n:'b',t:`Cashflow: saldo negativo en ${MESL[+ng.ym.slice(5)-1]}`,p:`Con los ingresos y compromisos cargados faltarían ${fmt(-ng.fin)}. Mirá el detalle en Cashflow proyectado.`});
   else if(!S.ingProy.length&&S.movs.length>20)out.push({e:'💧',n:'',t:'Cargá tus ingresos proyectados',p:'Con sueldo, aguinaldo y otros cobros cargados en la Agenda, la app proyecta tu saldo mes a mes y te avisa faltantes.'})}
  // carga de deuda y fijos
  {const nx2=ymAdd(today().slice(0,7),1);const pr=S.prestamos.reduce((a,p)=>{const c=cuotaPrestamo(p,nx2);return a+(c?conv(+p.cuota,p.moneda,M1()):0)},0);
   const deuda=pr+cuotasNx;if(ingProm&&pr>0&&deuda/ingProm>0.3)out.push({e:'🏛️',n:'b',t:`Deuda: ${Math.round(deuda/ingProm*100)}% del ingreso`,p:`El mes próximo pagás ${fmt(pr)} de préstamos y ${fmt(cuotasNx)} de cuotas de tarjeta. Por encima de 30–35% conviene no tomar deuda nueva y priorizar cancelar la de mayor tasa.`});
   const mens=S.fijos.filter(f=>f.activo!==false).reduce((a,f)=>a+fMens(f),0);
   if(ingProm&&mens/ingProm>0.4){const top=[...S.fijos].filter(f=>f.activo!==false).sort((a,b)=>conv(b.importe,b.moneda,M1())/(b.freq||1)-conv(a.importe,a.moneda,M1())/(a.freq||1)).slice(0,3).map(f=>esc(f.nombre)).join(', ');
     out.push({e:'📌',n:'w',t:`Gastos fijos: ${Math.round(mens/ingProm*100)}% del ingreso`,p:`Equivalen a ${fmt(mens)}/mes. Los más pesados: ${top}. Revisá planes, pago anual con descuento (patente, inmobiliario suelen tenerlo) y seguros cotizando otra compañía.`})}
   const usd=movsMes(ym).filter(x=>x.tipo==='gasto'&&x.moneda===M2()&&met(x.metodo)?.tipo==='credito').reduce((a,x)=>a+x.importe,0);
   if(usd>0)out.push({e:'💵',n:'',t:`Consumos en dólares con tarjeta: ${fmt2(usd,M2())}`,p:'Si tenés dólares, cancelá ese saldo en USD: evitás el tipo de cambio de la tarjeta y posibles percepciones. Verificá con tu banco el régimen vigente.'})}
  // concentración de gastos por categoría sin registro de descripción
  const sinDesc=movsMes(ym).filter(x=>x.tipo==='gasto'&&!x.desc).length;const nG=movsMes(ym).filter(x=>x.tipo==='gasto').length;
  if(nG>10&&sinDesc/nG>0.5)out.push({e:'✍️',n:'',t:'Agregá descripción a tus gastos',p:'Más de la mitad no tiene detalle: la conciliación y la detección de recurrentes funcionan mucho mejor con el nombre del comercio.'});
  return out;
}

function trNames(){const n=[...S.metodos.map(m=>m.nombre),...S.miembros,...S.fijos.map(f=>f.nombre),...S.prestamos.map(p=>p.nombre),...S.ingProy.map(f=>f.nombre),...Object.values((S.cloud||{}).vinculos||{}).map(v=>v.tarjeta||''),...S.prestamos.map(p=>p.entidad||''),(S.cloud||{}).nombre||'',...S.metodos.map(m=>m.compartida&&m.compartida.titular||'')].filter(x=>x&&x.length>1);
  const sig=n.join('|');if(sig!==TR_NAMES_SIG){TR_NAMES_SIG=sig;const u=[...new Set(n)].sort((a,b)=>b.length-a.length).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));TR_NAMES_RE=u.length?new RegExp('(?<![\\p{L}\\d])('+u.join('|')+')(?![\\p{L}\\d])','gu'):null}return TR_NAMES_RE}
const TR_TOK=new RegExp('((?:US\\$|R\\$|S\\/|[A-Z]{3}(?=\\s?-?\\d))?\\s?-?[$€£]?\\s?-?\\d(?:[\\d.,]*\\d)?(?:\\s?[kM](?![\\p{L}]))?)|(?<![\\p{L}])('+TR_MONTHS.join('|')+')(?![\\p{L}])','gu');
function trKey(s){const vals=[];let t=s;const nre=trNames();const ph=()=>'\u0001'+String.fromCharCode(0xE000+vals.length-1)+'\u0002';
  if(nre)t=t.replace(nre,m=>{vals.push(m);return ph()});
  t=t.replace(TR_TOK,(m)=>{if(/^\s*$/.test(m))return m;const lead=m.match(/^\s*/)[0];vals.push(m.slice(lead.length));return lead+ph()});
  const ord=[];t=t.replace(/\u0001([-])\u0002/g,(m,c)=>{ord.push(vals[c.charCodeAt(0)-0xE000]);return'{'+(ord.length-1)+'}'});return{key:t,vals:ord}}
function trStr(v){if(!v||!/[A-Za-zÁÉÍÓÚáéíóúñÑ¿¡]/.test(v))return v;const lead=v.match(/^\s*/)[0],trail=v.match(/\s*$/)[0];const core=v.trim();if(!core)return v;
  const d=window.TR_DICT;if(d[core]!==undefined)return lead+d[core]+trail;
  const{key,vals}=trKey(core);const tpl=d[key];if(tpl!==undefined)return lead+tpl.replace(/\{(\d+)\}/g,(m,i)=>vals[+i]??'')+trail;
  for(const[re,rp]of window.TR_PAT){if(re.test(core))return lead+core.replace(re,rp)+trail}
  if(/ · | → |: /.test(core)){const parts=core.split(/( · | → |: )/);let ch=false;const o=parts.map(p=>{if(p===' · '||p===' → '||p===': ')return p;const r=trStr(p);if(r!==p)ch=true;return r});if(ch)return lead+o.join('')+trail}
  return v}
const TR_SKIP='[data-notr],script,style,textarea';const trSeen=new WeakMap();
function trNode(n){if(n.nodeType===3){const p=n.parentElement;if(!p||p.closest(TR_SKIP))return;const v=n.nodeValue;if(trSeen.get(n)===v)return;const r=trStr(v);if(r!==v)n.nodeValue=r;trSeen.set(n,n.nodeValue);return}
  if(n.nodeType!==1||n.closest(TR_SKIP))return;
  const els=[n,...n.querySelectorAll('[placeholder],[title],[aria-label]')];els.forEach(e=>{['placeholder','title','aria-label'].forEach(a=>{const v=e.getAttribute&&e.getAttribute(a);if(v&&!e.closest(TR_SKIP)){const r=trStr(v);if(r!==v)e.setAttribute(a,r)}})});
  const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);let t;while((t=w.nextNode()))trNode(t)}
const trObs=new MutationObserver(ms=>{if(!EN()||window.__trOff)return;for(const m of ms){if(m.type==='characterData')trNode(m.target);else m.addedNodes.forEach(trNode)}});
function trInit(){trObs.disconnect();if(EN()&&!window.__trOff){trObs.observe(document.body,{childList:true,subtree:true,characterData:true});trNode(document.body)}}
window.__trReady=true;
// recolector (solo para generar el diccionario en pruebas)
window.__trCollect=function(){const out=window.__trKeys=window.__trKeys||{};const add=v=>{if(!v)return;const c=v.trim();if(!c||!/[A-Za-zÁÉÍÓÚáéíóúñÑ]/.test(c))return;const{key}=trKey(c);if(/^[\s{}\d·•\-–—:,.()\/+=%|!?✔✓→←›‹×✕#*]*$/.test(key))return;out[key]=(out[key]||0)+1};
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let t;while((t=w.nextNode())){const p=t.parentElement;if(!p||p.closest(TR_SKIP))continue;add(t.nodeValue)}
  document.querySelectorAll('[placeholder],[title],[aria-label]').forEach(e=>{if(e.closest(TR_SKIP))return;['placeholder','title','aria-label'].forEach(a=>add(e.getAttribute(a)))});return Object.keys(out).length};

const HELP={
 spRes:["⚖️ Resultado", "Lo que te quedó en el mes: <b>ingresos menos gastos</b>. Verde = ahorraste; rojo = gastaste más de lo que entró. Abajo, el mismo cálculo para el trimestre, el semestre y el año. Tocá para ver el detalle y el cashflow."],spVen:["🔴 Vencido", "Lo que ya tendrías que haber pagado y todavía no registraste: cuotas, servicios, colegio, resúmenes. Si dice <b>Al día</b>, no debés nada atrasado. Tocá para pagar o registrar cada uno."],spPv:["📅 Por vencer", "Lo que tenés que pagar de acá en adelante: resúmenes de tarjeta, cuotas de préstamos y gastos fijos de este mes y el próximo. La barra muestra cuánto vence este mes, el próximo y después."],spGas:["🧩 Gastos", "En qué se fue la plata este mes, por rubro. La parte más clara del gráfico es lo <b>estimado</b>: gastos fijos y cuotas que todavía no confirmaste. Tocá para comparar con otros meses."],spCta:["🏦 Cuentas", "Cuánto tenés (efectivo, bancos y billeteras) y cuánto debés (tarjetas y compromisos, como préstamos o deudas vencidas). Tocá para ver cada cuenta y tu patrimonio neto."],spLibre:["💰 Libre para gastar", "Cuánta plata podés gastar <b>por día</b> hasta fin de mes sin dejar de pagar nada: lo que tenés hoy, más lo que falta cobrar este mes, menos lo que vence este mes y lo atrasado. Tocá para ver la cuenta."],
 buscar:['🔎 Buscar','Escribí parte del nombre (por ejemplo "coto" o "nafta") y la lista muestra solo esos movimientos del mes.'],

 compartidas:['🔗 Tarjetas compartidas','Sirve si tenés <b>tarjetas adicionales</b> (por ejemplo, la de tu pareja).<br><br>1. El <b>titular</b> entra a la tarjeta (Ajustes → Vías de pago), toca <b>🔗 Vincular</b> al lado del adicional y le manda el código por WhatsApp.<br>2. El <b>adicional</b> instala la app, crea su cuenta e ingresa el código.<br><br>Desde ese momento, cada gasto que el adicional carga con esa tarjeta <b>le aparece al titular al instante</b>, con una notificación. El resto de los gastos de cada uno sigue siendo privado.'],
 kpis:['📊 Tu mes en números','<b>Ingresos</b>: toda la plata que entró (sueldo, cobros). <b>Gastos</b>: todo lo que gastaste. <b>Resultado</b>: la diferencia. Si es verde, ese mes ahorraste; si es rojo, gastaste más de lo que entró.<br><br>El cuadro <b>Efectivo sin registrar</b> avisa si sacaste plata del cajero y no anotaste en qué la usaste.<br><br>Para ver otro mes usá las flechas ‹ › de arriba.'],
 compromisos:['📌 Compromisos del mes','Son los pagos que <b>sí o sí</b> tenés que hacer este mes: resúmenes de tarjeta, cuotas de préstamos y gastos fijos (colegio, luz, impuestos…).<br><br>El número grande es el <b>pendiente acumulado</b>: lo de este mes más lo que quedó sin pagar de meses anteriores. La barra verde muestra cuánto del mes ya pagaste. Tocá esta sección para ir a la <b>Agenda</b> y marcar lo que vas pagando.'],
 cashflow:['💧 Cashflow (flujo de fondos)','Es una <b>proyección de cuánta plata vas a tener</b> a fin de cada mes.<br><br>La cuenta es simple:<br><b>lo que tenés hoy + lo que vas a cobrar − lo que vas a pagar = lo que te va a quedar</b>.<br><br>Si la línea baja de cero, te avisa con tiempo para que te organices (postergar una compra, no tomar cuotas nuevas, etc.).'],
 tarjetas:['💳 Tus tarjetas de crédito','Cada tarjeta muestra cuánto vas a pagar en el <b>próximo resumen</b> y cuántos días faltan para el vencimiento.<br><br>• <b>Cierre</b>: el día en que la tarjeta "corta" y arma el resumen.<br>• <b>Vencimiento</b>: el último día para pagarlo sin recargos.<br><br>Lo que comprás <b>después del cierre</b> se paga un mes más tarde. Tocá una tarjeta para ver el detalle compra por compra.'],
 categorias:['🧩 ¿En qué se va la plata?','El círculo muestra cómo se reparten tus gastos del mes por <b>concepto</b> (súper, combustible, servicios…). Cuanto más grande la porción, más gastaste ahí.<br><br>Tocá o pasá el dedo por el gráfico para ver el importe exacto.'],
 cuentas:['🏦 Cuentas y deudas','Muestra la plata que tenés en cada cuenta, billetera virtual y en efectivo, y lo que debés en cada tarjeta y préstamo.<br><br>Para que los números coincidan con el banco, cargá el <b>saldo inicial</b> de cada cuenta en Ajustes ⚙️ el día que empezás a usar la app.'],
 ultimos:['🕒 Últimos movimientos','Lo último que anotaste. Tocá cualquier renglón para <b>corregirlo o borrarlo</b>. La lista completa está en <b>Movimientos</b>.'],
 venc:['🗓️ Vencimientos del mes','Todo lo que vence este mes, ordenado por fecha. Cada renglón dice si está <b>pagado</b>, <b>parcial</b> (pagaste una parte), <b>pendiente</b> o <b>vencido</b>.<br><br>¿Te olvidaste de cargar algo que debías en un mes anterior? Andá a ese mes con las flechas ‹ › y tocá <b>+ Impago</b>.<br><br>Cuando pagás algo, tocá <b>Registrar</b> (o <b>Pagar</b> en tarjetas): la app lo anota y lo marca como pagado.'],
 cobros:['💰 Cobros esperados','La plata que esperás <b>recibir</b> este mes: sueldo, aguinaldo, alquileres, etc.<br><br>Cuando te acrediten, tocá <b>Registrar cobro</b> y poné el importe real. Así el cashflow sabe que ya entró.'],
 debitos:['🔁 Débitos automáticos en tarjetas','Gastos que se cobran solos en la tarjeta todos los meses (seguros, suscripciones, servicios). La app ya los suma al resumen de esa tarjeta.<br><br><b>Proyectado</b>: todavía no pasó. <b>Estimado</b>: ya se anotó con un importe aproximado; corregilo cuando llegue el resumen.'],
 ingproy:['💰 Ingresos proyectados','Cargá una sola vez la plata que cobrás regularmente: sueldo, aguinaldo, honorarios, alquileres. La app la usa para avisarte cada cobro y para calcular el <b>cashflow</b>.<br><br>Ejemplo: aguinaldo → frecuencia <b>Semestral</b>, primer cobro <b>junio</b>. Un bono puntual → <b>Una sola vez</b>.'],
 fijos:['📌 Gastos fijos','Son los gastos que se repiten: colegio, inglés, mensualidades, luz, gas, agua, internet, impuestos, patente, seguros.<br><br>Cargalos <b>una vez</b> y la app te los recuerda cada mes.<br>• <b>Automático</b>: se anota solo (para débitos automáticos).<br>• <b>Lo confirmo yo</b>: queda pendiente hasta que lo pagues.<br>• <b>Variable</b>: para facturas que cambian (luz, gas); cargás un estimado y después lo corregís.'],
 prest:['🏛️ Préstamos','Para préstamos de <b>cuota fija</b> (la misma cuota todos los meses). Cargás la cuota, cuántas son, cuántas ya pagaste y la fecha de la próxima.<br><br>La app te avisa cada vencimiento y te muestra cuánto falta pagar. Si cargás el capital y la tasa, también ves cuánto de cada cuota es interés.'],
 impPlan:['📥 Importar desde Excel','Si tenés muchos datos, podés cargarlos de una sola vez con una planilla: cuotas pendientes, gastos fijos, préstamos e ingresos.<br><br>1. Descargá la <b>Plantilla</b>.<br>2. Completala en Excel o Google Sheets (las filas que dicen EJEMPLO se ignoran).<br>3. Tocá <b>Importar</b> y elegí el archivo. Vas a ver todo antes de confirmar.'],
 acum:['🧮 Saldo pendiente acumulado','Es lo que <b>todavía debés pagar hasta este mes</b>: lo pendiente del mes más todo lo que quedó <b>sin pagar de meses anteriores</b> (resúmenes, cuotas de préstamos, gastos fijos).<br><br>Si ya pagaste algo y figura acá, es porque no lo registraste: tocá <b>Registrar</b> y desaparece de la deuda.<br><br>Si mirás un mes futuro, supone que no pagás nada de lo anterior: así ves cuánto se acumularía.'],
 puntuales:['🧾 Compromisos puntuales','Pagos que <b>no se repiten</b>: una factura, un impuesto atrasado, plata que le debés a alguien. Cargás el importe y el vencimiento (aunque sea pasado) y queda <b>pendiente</b> en ese mes hasta que lo pagues. Podés pagarlo en partes.'],
 agKpis:['📌 Resumen de la Agenda','<b>Comprometido</b>: el total de pagos del mes (tarjetas, préstamos, gastos fijos). <b>Pendiente</b>: lo que todavía no pagaste.'],
 impRes:['📥 Importar un resumen','Cuando te llega el resumen de la tarjeta o del banco, subilo acá (PDF, CSV o copiando el texto). La app lo compara con lo que anotaste y te muestra:<br>✔ lo que coincide,<br>⚠ lo que está en el resumen y <b>no anotaste</b> (con botón para cargarlo),<br>✖ lo que anotaste y <b>no aparece</b>,<br>🏦 comisiones e intereses que te cobraron.'],
 concTabs:['🔗 Conciliar','"Conciliar" es <b>comparar</b> lo que anotaste con lo que dice el banco, para encontrar olvidos, errores o cobros que no reconocés.<br><br><b>Resúmenes</b>: tarjetas, bancos y billeteras. <b>Efectivo</b>: controla la plata que sacaste del cajero.'],

 retReg:['📈 Retirado vs registrado','Barras azules: efectivo que sacaste. Barras naranjas: gastos en efectivo que anotaste. Cuanto más parecidas, mejor estás registrando.'],
 arqueo:['🧮 Arqueo de caja','Contá la plata que tenés en la billetera y escribila acá. La app la compara con lo que debería haber según tus anotaciones y te ofrece ajustar la diferencia.'],

 comprom:['📅 Lo ya comprometido','Lo que <b>ya debés</b> pagar en los próximos meses aunque no compres nada más: cuotas de tarjetas, débitos automáticos, préstamos y gastos fijos. Sirve para no tomar más cuotas de las que podés pagar.'],
 porVia:['💳 Por vía de pago','Cuánto gastaste con cada tarjeta, cuenta o en efectivo durante el mes.'],

 propuestas:['💡 Propuestas de ahorro','La app revisa tus datos y te sugiere dónde mejorar: gastos chicos que suman mucho ("gastos hormiga"), suscripciones repetidas, comisiones bancarias, demasiadas cuotas, etc. Cuanto más completo anotes, mejores consejos.'],
 analFlujo:['💧 Cashflow proyectado','Abre la proyección de cuánta plata vas a tener mes a mes.'],

 saldoProy:['📈 Saldo proyectado','La plata que te quedaría a fin de cada mes. Si un punto queda <b>debajo de cero</b> (en rojo), ese mes no te alcanzaría: es momento de ajustar.'],

 supuestos:['⚙️ Supuestos','Son los datos que la app usa para proyectar. El más importante es el <b>gasto corriente</b>: lo que gastás por mes en el día a día (súper, comida, combustible). Si lo dejás vacío, la app usa el promedio de tus últimos 3 meses.<br><br><b>Inflación</b>: si ponés 2%, la app supone que esos gastos suben 2% por mes.'],

    add({tipo:'gasto',fecha:F(6),cat:'subs',importe:sc(11999),metodo:'vgal',desc:'Netflix'});
    add({tipo:'gasto',fecha:F(7),cat:'subs',importe:sc(6990),metodo:vmp,desc:'Spotify'});
    add({tipo:'gasto',fecha:F(9),cat:'hogar',importe:sc(85000),metodo:'mp',desc:L('Expensas','HOA fee')});
    for(let i=0;i<5;i++)add({tipo:'gasto',fecha:F(r(1,lim)),cat:'super',importe:sc(r(30000,120000)),metodo:['vgal','vicbc','dgal'][i%3],desc:sup[i]});
    for(let i=0;i<4;i++)add({tipo:'gasto',fecha:F(r(1,lim)),cat:'comb',importe:sc(r(45000,70000)),metodo:'mgal',desc:L('YPF','Shell')});
    for(let i=0;i<12;i++)add({tipo:'gasto',fecha:F(r(1,lim)),cat:['comida','delivery','transp','otros'][i%4],importe:sc(r(1500,4900)),metodo:'efe',desc:chico[i%4]});
    add({tipo:'gasto',fecha:F(12),cat:'comida',importe:sc(r(40000,80000)),metodo:'efe',desc:L('Cena familiar','Family dinner')});
    add({tipo:'gasto',fecha:F(14),cat:'salud',importe:sc(r(15000,30000)),metodo:vmp,desc:L('Farmacia','Pharmacy')});
    if(k===2)add({tipo:'gasto',fecha:F(18),cat:'hogar',importe:sc(900000),metodo:'vgal',cuotas:6,desc:L('Heladera','Refrigerator')});
    if(k===1)add({tipo:'gasto',fecha:F(20),cat:'ropa',importe:sc(240000),metodo:'vicbc',cuotas:3,desc:L('Zapatillas','Sneakers')});

    add({tipo:'gasto',fecha:F(r(2,lim)),cat:'super',importe:sc(r(25000,60000)),metodo:'vgal',plastico:pareja,quien:pareja,desc:L('Farmacia / súper','Pharmacy / groceries')});
    if(k===0&&M2())add({tipo:'gasto',fecha:F(4),cat:'subs',importe:20,moneda:M2(),metodo:'vgal',desc:'ChatGPT Plus'});
  }
  const vg=met('vgal');vg.adicionales=vg.adicionales||[];if(!vg.adicionales.includes(pareja))vg.adicionales.push(pareja);if(!S.miembros.includes(pareja))S.miembros.push(pareja);
  const ym0=today().slice(0,7),ymP=ymAdd(ym0,-3);const hoyF=ymd(new Date(Date.now()-100*864e5));
  [[L('Colegio','School tuition'),'educ','cgal',380000,false,10,1,false],[L('Inglés (instituto)','Music lessons'),'educ','mp',65000,false,8,1,false],[L('Mensualidad hija','Allowance (daughter)'),'familia','cgal',300000,false,5,1,false],
   [L('Luz','Electricity'),'serv','vgal',48000,true,18,1,true],[L('Gas hogar','Gas'),'serv','cgal',22000,true,14,2,false],[L('Agua','Water'),'serv','cgal',15000,true,12,2,false],['Internet','serv','vgal',29000,false,9,1,true],

  if(M2()&&(!S.cfg.tc||+S.cfg.tc===1))S.cfg.tc=tcSug(M1(),M2());
  generarAuto();demoPagar(L('Gas hogar','Gas'));save();render();toast(L('Datos de ejemplo cargados','Sample data loaded'));

function tcSug(a,b){const R={ARS:1200,USD:1,EUR:0.92,GBP:0.79,BRL:5.5,MXN:18,CLP:950,COP:4000,UYU:40,PEN:3.7,NZD:1.7};const x=(R[a]||1)/(R[b]||1);return x>=100?Math.round(x):Math.round(x*100)/100}
function demoPagar(dejar){const hoy=today(),ymH=hoy.slice(0,7);const add=o=>S.movs.push(Object.assign({id:uid(),moneda:M1(),quien:S.miembros[0],hora:'10:00',cuotas:1},o));
  for(let k=6;k>=0;k--){const ym=ymAdd(ymH,-k);
    S.fijos.forEach(f=>{const m=met(f.metodo);if(m&&m.tipo==='credito')return;const st=inicioFijo(f);if(st&&ym<st)return;const d=fijoVence(f,ym);if(!d||d>=hoy)return;if(f.nombre===dejar&&k<=1)return;const e=estadoFijo(f,ym);if(e.full)return;
      add({tipo:'gasto',fecha:d,cat:f.cat,metodo:f.metodo,importe:Math.round(conv(e.resta,M1(),f.moneda||M1())*100)/100,moneda:f.moneda||M1(),desc:f.nombre,fijo:f.id,fijoMes:ym})});
    S.prestamos.forEach(p=>{const c=cuotaPrestamo(p,ym);if(!c||c.fecha>=hoy)return;const e=estadoPrest(p,c.k);if(e.full)return;add({tipo:'gasto',fecha:c.fecha,cat:'prest',metodo:p.cuenta,importe:+p.cuota,moneda:p.moneda||M1(),desc:p.nombre,prest:p.id,prestCuota:c.k})})}
  S.metodos.filter(m=>m.tipo==='credito'&&!esAdic(m)).forEach(m=>{resumenesTarjeta(m,ymAdd(ymH,-6)+'-01',8).forEach(r=>{if(r.venc>=hoy||r.total<0.5)return;
    const lim=ymd(new Date(parseYmd(r.venc).getTime()+12*864e5));if(S.movs.some(x=>x.tipo==='transf'&&x.destino===m.id&&x.fecha>r.cierre&&x.fecha<=lim))return;
    add({tipo:'transf',fecha:r.venc,origen:m.cuentaPago||'cgal',destino:m.id,importe:Math.round(r.ars*100)/100,desc:(EN()?'Payment ':'Pago ')+m.nombre});
    if(r.usd>=0.5)add({tipo:'transf',fecha:r.venc,origen:m.cuentaPago||'cgal',destino:m.id,importe:Math.round(r.usd*100)/100,moneda:M2(),desc:(EN()?'Payment ':'Pago ')+m.nombre})})})}
